<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Guard — 书签管理</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3 2h10a1 1 0 0 1 1 1v11l-6-3-6 3V3a1 1 0 0 1 1-1z' fill='none' stroke='%2358a6ff' stroke-width='1.5'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/bookmarks.css">
</head>
<body>

<!-- ===== 统一顶部导航 ===== -->
<header>
  <div class="header-left">
    <h1 class="logo">AI <span>Guard</span></h1>
    <nav class="nav-tabs">
      <a href="/" class="nav-tab" data-i18n="nav.monitor">监控面板</a>
      <a href="/usage.html" class="nav-tab" data-i18n="nav.usage">Claude 统计</a>
      <a href="/bookmarks.html" class="nav-tab active" data-i18n="nav.bookmarks">书签管理</a>
      <a href="/tools.html" class="nav-tab">工具导航</a>
      <a href="/practices.html" class="nav-tab">最佳实践</a>
    </nav>
  </div>
  <div class="header-right">
    <div class="lang-toggle">
      <button class="lang-btn" id="lang-zh" onclick="setLang('zh')">中</button>
      <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()"></button>
  </div>
</header>

<!-- Toast 通知 -->
<div id="toast"></div>

<!-- ── Main Content ────────────────────────────── -->
<main>
  <!-- AI Config Notice -->
  <div id="ai-config-notice"></div>

  <!-- Browser Selector -->
  <div class="card" id="browser-card">
    <div class="card-header">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2a10 10 0 0 1 3 6 10 10 0 0 1-3 6 10 10 0 0 1-3-6 10 10 0 0 1 3-6z"/></svg>
        <span data-i18n="browserSelect"></span>
      </div>
      <button class="btn" id="refresh-browsers-btn" onclick="loadBrowsers()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M14 8A6 6 0 1 1 2 8"/><path d="M14 3v5h-5"/></svg>
        <span data-i18n="refresh"></span>
      </button>
    </div>
    <div id="browser-list" class="loading">
      <div class="spinner"></div>
      <div class="loading-text" data-i18n="loading"></div>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="grid-4 hidden" id="stats-section">
    <div class="stat-card"><div class="stat-label" data-i18n="totalBookmarks"></div><div class="stat-value blue" id="st-total">0</div></div>
    <div class="stat-card"><div class="stat-label" data-i18n="totalFolders"></div><div class="stat-value green" id="st-folders">0</div></div>
    <div class="stat-card"><div class="stat-label" data-i18n="totalDomains"></div><div class="stat-value purple" id="st-domains">0</div></div>
    <div class="stat-card"><div class="stat-label" data-i18n="issuesFound"></div><div class="stat-value orange" id="st-issues">--</div><div class="stat-sub" id="st-issues-sub" data-i18n="clickAnalyze"></div></div>
  </div>

  <!-- AI Organize Button -->
  <div class="hidden text-center p-4-0" id="ai-organize-section">
    <button class="btn-ai" id="btn-ai-organize" onclick="openAIWizard()" disabled>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 1l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z"/></svg>
      <span data-i18n="aiOrganize"></span>
    </button>
    <div class="text-11px text-muted2 mt-6" data-i18n="aiOrganizeDesc"></div>
  </div>

  <!-- Folder Distribution + Analysis  -->
  <div class="grid-2 hidden" id="middle-section">
    <!-- Folder Distribution -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M2 3h4l2 2h6v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3z"/></svg>
          <span data-i18n="folderDist"></span>
        </div>
      </div>
      <div id="folder-dist" class="folder-bar-wrap max-h-320 overflow-y"></div>
    </div>
    <!-- Analysis -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
          <span data-i18n="analysis"></span>
        </div>
        <div class="flex-row flex-gap-2">
          <button class="btn btn-blue" onclick="analyzeBookmarks()">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
            <span data-i18n="analyze"></span>
          </button>
          <button class="btn btn-primary" onclick="aiCategorize()">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 1l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z"/></svg>
            <span data-i18n="aiCategorize"></span>
          </button>
        </div>
      </div>
      <div id="analysis-result">
        <div class="empty-state empty-state-lg">
          <svg width="28" height="28" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
          <div class="title" data-i18n="noAnalysis"></div>
          <div data-i18n="clickAnalyzeHint"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bookmark List -->
  <div class="card hidden" id="bookmarks-card">
    <div class="card-header">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 2h10a1 1 0 0 1 1 1v11l-6-3-6 3V3a1 1 0 0 1 1-1z"/></svg>
        <span data-i18n="bookmarkList"></span>
        <span id="bm-count-badge" class="badge badge-blue ml-6"></span>
      </div>
      <div class="flex-row flex-gap-2">
        <button class="btn" onclick="exportBookmarks('json')">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 2v8M4 7l4 4 4-4"/><path d="M2 12v2h12v-2"/></svg>
          JSON
        </button>
        <button class="btn" onclick="exportBookmarks('html')">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 2v8M4 7l4 4 4-4"/><path d="M2 12v2h12v-2"/></svg>
          HTML
        </button>
        <button class="btn" onclick="exportBookmarks('csv')">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 2v8M4 7l4 4 4-4"/><path d="M2 12v2h12v-2"/></svg>
          CSV
        </button>
      </div>
    </div>
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
        <input type="text" class="search-input" id="search-input" data-i18n-placeholder="searchPlaceholder" oninput="filterBookmarks()">
      </div>
      <select class="filter-select" id="folder-filter" onchange="filterBookmarks()">
        <option value="" data-i18n="allFolders"></option>
      </select>
      <select class="filter-select" id="sort-select" onchange="sortBookmarks()">
        <option value="name-asc" data-i18n="sortNameAsc"></option>
        <option value="name-desc" data-i18n="sortNameDesc"></option>
        <option value="url-asc" data-i18n="sortUrlAsc"></option>
        <option value="folder-asc" data-i18n="sortFolderAsc"></option>
      </select>
    </div>
    <!-- Table -->
    <div class="bookmark-table-wrap" id="bm-table-wrap">
      <table class="bookmark-table">
        <thead>
          <tr>
            <th class="w-36px">#</th>
            <th data-i18n="colName" onclick="toggleSort('name')"><span></span><span class="sort-arrow"></span></th>
            <th data-i18n="colUrl" onclick="toggleSort('url')"><span></span><span class="sort-arrow"></span></th>
            <th data-i18n="colFolder" onclick="toggleSort('folder')"><span></span><span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="bm-tbody"></tbody>
      </table>
    </div>
    <div class="footer-bar">
      <span id="footer-info"></span>
      <span id="footer-status"></span>
    </div>
  </div>
</main>

<!-- ── AI Organize Wizard Modal ────────────────── -->
<div class="modal-overlay" id="wizard-overlay" onclick="if(event.target===this)closeWizard()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--blue)" stroke-width="1.75" stroke-linecap="round"><path d="M8 1l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z"/></svg>
        <span id="wizard-title"></span>
      </div>
      <button class="modal-close" onclick="closeWizard()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="modal-body" id="wizard-body"></div>
    <div class="modal-footer">
      <div class="steps" id="wizard-steps"></div>
      <div class="flex-row flex-gap-2">
        <button class="btn hidden" id="wizard-back" onclick="wizardBack()" data-i18n="back"></button>
        <button class="btn btn-blue" id="wizard-next" onclick="wizardNext()"></button>
      </div>
    </div>
  </div>
</div>

let _lang = localStorage.getItem('ai-guard-lang') || 'zh';
const t = (key, ...args) => {
  const v = T[_lang][key];
  return typeof v === 'function' ? v(...args) : (v || key);
};

// ── SVG 图标库（与 index.html 保持一致）────────────────────
const ICONS = {
  bolt:   `<path d="M9.5 2L4 9h4.5L7 14l6-7H9.5z" fill="currentColor" stroke="none"/>`,
  check:  `<polyline points="2.5,8.5 6,12.5 13.5,4" stroke-width="2"/>`,
  warn:   `<path d="M8 2.5L14.5 14H1.5z" stroke-width="1.75"/><line x1="8" y1="7" x2="8" y2="10.5" stroke-width="2"/><circle cx="8" cy="12.5" r="0.85" fill="currentColor" stroke="none"/>`,
  cross:  `<line x1="3" y1="3" x2="13" y2="13" stroke-width="2"/><line x1="13" y1="3" x2="3" y2="13" stroke-width="2"/>`,
};
function icon(name, cls='') {
  const paths = ICONS[name] || '';
  return `<svg class="icon${cls?' '+cls:''}" viewBox="0 0 16 16" width="1em" height="1em"
    fill="none" stroke="currentColor" stroke-width="1.75"
    stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${paths}</svg>`;
}

// ── Toast 通知（与 index.html 保持一致）────────────────────
let _toastTimer;
function showToast(iconName, msg, isErr = false) {
  const el = document.getElementById('toast');
  const cls = isErr ? 'icon-red' : (iconName === 'bolt' ? 'icon-yellow' : 'icon-green');
  el.innerHTML = icon(iconName, cls) + `<span>${msg}</span>`;
  el.style.borderColor = isErr ? 'var(--red)' : 'var(--green)';
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}

function setLang(lang) {
  _lang = lang; localStorage.setItem('ai-guard-lang', lang);
  applyI18n(); applyLangButtons();
  renderBookmarks(); // re-render with new language
}

function applyLangButtons() {
  document.getElementById('lang-zh').classList.toggle('active', _lang === 'zh');
  document.getElementById('lang-en').classList.toggle('active', _lang === 'en');
}

function applyI18n() {
  // data-i18n text
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (T[_lang][key] && typeof T[_lang][key] === 'string') el.textContent = T[_lang][key];
  });
  // data-i18n-placeholder
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (T[_lang][key]) el.placeholder = T[_lang][key];
  });
  // selects
  document.querySelectorAll('option[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (T[_lang][key] && typeof T[_lang][key] === 'string') el.textContent = T[_lang][key];
  });
}

/* ══════════════════════════════════════════════════
   Theme
   ══════════════════════════════════════════════════ */
const THEME_ICONS = {
  moon: `<path d="M12 12.5A5.5 5.5 0 0 1 6.5 4a5.5 5.5 0 1 0 7 7.5c-.5.1-1 .05-1.5 0z" fill="currentColor" stroke="none"/>`,
  sun: `<circle cx="8" cy="8" r="3"/><line x1="8" y1="1.5" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="14.5"/><line x1="1.5" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="14.5" y2="8"/><line x1="3.5" y1="3.5" x2="4.5" y2="4.5"/><line x1="11.5" y1="11.5" x2="12.5" y2="12.5"/><line x1="11.5" y1="3.5" x2="12.5" y2="4.5"/><line x1="3.5" y1="11.5" x2="4.5" y2="12.5"/>`,
};
function svgIcon(name) {
  return `<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${THEME_ICONS[name]||''}</svg>`;
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').innerHTML = theme === 'dark' ? svgIcon('moon') : svgIcon('sun');
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ai-guard-theme', next);
  applyTheme(next);
}

/* ══════════════════════════════════════════════════
   State
   ══════════════════════════════════════════════════ */

let filteredBookmarks = [];

   ══════════════════════════════════════════════════ */
function escapeHtml(text) {
  if (!text) return '';
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function openPrivacySettings() {
  // 打开 macOS 系统设置 → 隐私与安全性 → 完全磁盘访问权限
  fetch('/api/system/open-privacy-settings', { method: 'POST' })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        alert(_lang === 'zh'
          ? '已打开系统设置。请在「完全磁盘访问权限」中勾选 AI Guard，然后刷新页面。'
          : 'System Settings opened. Enable AI Guard in "Full Disk Access", then refresh.');
      }
    })
    .catch(e => {
      console.error('打开隐私设置失败:', e);
      showToast('cross', t('loadBrowsersFailed'), true);
    });
}

async function selectBrowser(browser, cardEl) {
  currentBrowser = browser;
  document.querySelectorAll('.browser-card').forEach(c => c.classList.remove('active'));
  if (cardEl) cardEl.classList.add('active');

  // show sections — 移除 hidden class
  document.getElementById('stats-section').classList.remove('hidden');
  document.getElementById('ai-organize-section').classList.remove('hidden');
  document.getElementById('middle-section').classList.remove('hidden');
  document.getElementById('bookmarks-card').classList.remove('hidden');
  document.getElementById('btn-ai-organize').disabled = false;

  await Promise.all([loadBookmarks(browser), loadStats(browser)]);
}

/* ══════════════════════════════════════════════════
   Stats
   ══════════════════════════════════════════════════ */
async function loadStats(browser) {
  try {
    const res = await fetch(`/api/bookmarks/${browser}/stats`);
    const data = await res.json();
    const s = data.stats;

    document.getElementById('st-total').textContent = s.total.toLocaleString();
    document.getElementById('st-folders').textContent = Object.keys(s.folders).length.toLocaleString();
    document.getElementById('st-domains').textContent = Object.keys(s.domains).length.toLocaleString();

    // folder distribution
    folderStats = s.folders;
    renderFolderDist();
    populateFolderFilter();
  } catch (e) {
    console.error('加载书签数据失败:', e);
    showToast('cross', t('loadBookmarksFailed'), true);
  }
}

function renderFolderDist() {
  const el = document.getElementById('folder-dist');
  const sorted = Object.entries(folderStats).sort((a, b) => b[1] - a[1]);
  const max = sorted.length > 0 ? sorted[0][1] : 1;
  const colors = ['var(--blue)', 'var(--green)', 'var(--purple)', 'var(--orange)', 'var(--red)'];

  el.innerHTML = sorted.map(([name, count], i) =>
    `<div class="folder-bar-row${activeFolder === name ? ' active' : ''}" onclick="toggleFolderFilter('${escapeHtml(name)}')">
      <div class="folder-bar-name" title="${escapeHtml(name)}">${escapeHtml(name || t('uncategorizedFolder'))}</div>
      <div class="folder-bar-track"><div class="folder-bar-fill" style="width:${(count / max * 100).toFixed(1)}%;background:${colors[i % colors.length]};"></div></div>
      <div class="folder-bar-count">${count}</div>
    </div>`
  ).join('');
}

function toggleFolderFilter(folder) {
  activeFolder = activeFolder === folder ? '' : folder;
  document.getElementById('folder-filter').value = activeFolder;
  renderFolderDist();
  filterBookmarks();
}

function populateFolderFilter() {
  const sel = document.getElementById('folder-filter');
  const opts = [`<option value="" data-i18n="allFolders">${t('allFolders')}</option>`];
  Object.keys(folderStats).sort().forEach(f => {
    opts.push(`<option value="${escapeHtml(f)}">${escapeHtml(f || t('uncategorizedFolder'))} (${folderStats[f]})</option>`);
  });
  sel.innerHTML = opts.join('');
}

/* ══════════════════════════════════════════════════
   Bookmarks - Load & Render ALL
   ══════════════════════════════════════════════════ */
async function loadBookmarks(browser) {
  const tbody = document.getElementById('bm-tbody');
  tbody.innerHTML = `<tr><td colspan="4"><div class="loading"><div class="spinner"></div></div></td></tr>`;

  try {
    const res = await fetch(`/api/bookmarks/${browser}`);
    const data = await res.json();

    if (res.status === 403 || res.status === 500 || res.status === 404) {
      // Safari 权限问题 / 其他错误
      const detail = data.detail || '';
      if (res.status === 403 || browser === 'safari') {
        tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state" style="padding:32px;">
          <svg width="28" height="28" viewBox="0 0 16 16" fill="none" stroke="var(--yellow)" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v5M8 11v1"/><path d="M2 14h12L8 2 2 14z"/></svg>
          <div class="title">${_lang === 'zh' ? '需要授权' : 'Permission Required'}</div>
          <div style="max-width:400px;margin:8px auto;font-size:12px;color:var(--muted);">
            ${_lang === 'zh'
              ? 'Safari 书签需要「完全磁盘访问权限」。'
              : 'Safari bookmarks require "Full Disk Access".'}
          </div>
          <button class="btn btn-blue" style="margin-top:12px;padding:8px 20px;" onclick="openPrivacySettings()">
            ${_lang === 'zh' ? '打开系统设置' : 'Open System Settings'}
          </button>
        </div></td></tr>`;
      } else {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--red);">${escapeHtml(detail)}</td></tr>`;
      }
      return;
    }

    allBookmarks = data.bookmarks || [];

    if (allBookmarks.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state" style="padding:32px;">
        <svg width="28" height="28" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 2h10a1 1 0 0 1 1 1v11l-6-3-6 3V3a1 1 0 0 1 1-1z"/></svg>
        <div class="title">${_lang === 'zh' ? '该浏览器暂无书签' : 'No bookmarks in this browser'}</div>
        <div style="font-size:12px;color:var(--muted);max-width:360px;margin:8px auto;">
          ${_lang === 'zh'
            ? '该浏览器的默认 Profile 中没有保存书签。如果你在其他 Profile 中有书签，请切换到对应 Profile。'
            : 'Default profile has no bookmarks. Switch to the correct profile if you use a different one.'}
        </div>
      </div></td></tr>`;
      return;
    }

    filterBookmarks();
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--red);">${e.message}</td></tr>`;
  }
}

function filterBookmarks() {
  const query = (document.getElementById('search-input').value || '').toLowerCase();
  const folder = document.getElementById('folder-filter').value;

  filteredBookmarks = allBookmarks.filter(bm => {
    if (folder && (bm.folder || '') !== folder) return false;
    if (query) {
      const name = (bm.name || '').toLowerCase();
      const url = (bm.url || '').toLowerCase();
      if (!name.includes(query) && !url.includes(query)) return false;
    }
    return true;
  });

  sortBookmarks();
}

function sortBookmarks() {
  const sel = document.getElementById('sort-select').value;
  const [field, dir] = sel.split('-');
  sortField = field; sortAsc = dir === 'asc';

  filteredBookmarks.sort((a, b) => {
    const av = (a[sortField] || '').toLowerCase();
    const bv = (b[sortField] || '').toLowerCase();
    return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
  });

  renderBookmarks();
}

function toggleSort(field) {
  if (sortField === field) { sortAsc = !sortAsc; }
  else { sortField = field; sortAsc = true; }
  const sel = document.getElementById('sort-select');
  sel.value = `${field}-${sortAsc ? 'asc' : 'desc'}`;
  filteredBookmarks.sort((a, b) => {
    const av = (a[sortField] || '').toLowerCase();
    const bv = (b[sortField] || '').toLowerCase();
    return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
  });
  renderBookmarks();
}

function renderBookmarks() {
  const tbody = document.getElementById('bm-tbody');
  const bms = filteredBookmarks;
  const total = allBookmarks.length;

  document.getElementById('bm-count-badge').textContent = bms.length.toLocaleString();
  document.getElementById('footer-info').textContent = t('showingOf', bms.length.toLocaleString(), total.toLocaleString());

  if (bms.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">
      <svg width="28" height="28" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 2h10a1 1 0 0 1 1 1v11l-6-3-6 3V3a1 1 0 0 1 1-1z"/></svg>
      <div class="title">${t('noBookmarks')}</div></div></td></tr>`;
    return;
  }

  // Render ALL bookmarks using DocumentFragment for performance
  const fragment = document.createDocumentFragment();
  bms.forEach((bm, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td class="table-index">${i + 1}</td>` +
      `<td><div class="bm-name"><a href="${escapeHtml(bm.url)}" target="_blank" rel="noopener">${escapeHtml(bm.name)}</a></div></td>` +
      `<td><div class="bm-url" title="${escapeHtml(bm.url)}">${escapeHtml(bm.url)}</div></td>` +
      `<td><span class="bm-folder">${escapeHtml(bm.folder || t('uncategorizedFolder'))}</span></td>`;
    fragment.appendChild(tr);
  });

  tbody.innerHTML = '';
  tbody.appendChild(fragment);
}

/* ══════════════════════════════════════════════════
   Analysis
   ══════════════════════════════════════════════════ */
async function analyzeBookmarks() {
  if (!currentBrowser) return;
  const c = document.getElementById('analysis-result');
  c.innerHTML = `<div class="loading"><div class="spinner"></div><div style="margin-top:8px;">${t('analyzing')}</div></div>`;

  try {
    const res = await fetch('/api/bookmarks/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ browser: currentBrowser })
    });
    const data = await res.json();
    const issues = data.analysis.issues;
    const total = data.analysis.issue_count || 0;

    document.getElementById('st-issues').textContent = total;
    document.getElementById('st-issues').style.color = total > 0 ? 'var(--yellow)' : 'var(--green)';
    document.getElementById('st-issues-sub').textContent = '';

    if (total === 0) {
      c.innerHTML = `<div class="empty-state" style="padding:24px;">
        <svg width="28" height="28" viewBox="0 0 16 16" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round"><path d="M3 8l3 3 7-7"/></svg>
        <div class="title" style="color:var(--green);">${t('noIssues')}</div></div>`;
      return;
    }

    let html = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">';
    if (issues.duplicates.length) html += `<span class="badge badge-red">${t('duplicates')}: ${issues.duplicates.length}</span>`;
    if (issues.url_issues.length) html += `<span class="badge badge-yellow">${t('urlIssues')}: ${issues.url_issues.length}</span>`;
    if (issues.naming_issues.length) html += `<span class="badge badge-yellow">${t('namingIssues')}: ${issues.naming_issues.length}</span>`;
    if (issues.large_folders.length) html += `<span class="badge badge-blue">${t('largeFolders')}: ${issues.large_folders.length}</span>`;
    if (issues.uncategorized.length) html += `<span class="badge badge-purple">${t('uncategorized')}: ${issues.uncategorized.length}</span>`;
    html += '</div>';

    // Show details for duplicates
    if (issues.duplicates.length) {
      html += `<div style="margin-top:12px;font-size:12px;color:var(--muted);max-height:200px;overflow-y:auto;">`;
      issues.duplicates.slice(0, 20).forEach(d => {
        html += `<div style="padding:4px 0;border-bottom:1px solid var(--border);">${escapeHtml(d.name || d.url)}</div>`;
      });
      if (issues.duplicates.length > 20) html += `<div style="padding:4px 0;color:var(--muted2);">... +${issues.duplicates.length - 20} more</div>`;
      html += '</div>';
    }

    c.innerHTML = html;
  } catch (e) {
    c.innerHTML = `<div style="color:var(--red);padding:12px;">${e.message}</div>`;
  }
}

async function aiCategorize() {
  if (!currentBrowser) return;
  const c = document.getElementById('analysis-result');
  c.innerHTML = `<div class="loading"><div class="spinner"></div><div style="margin-top:8px;">${t('aiAnalyzing')}</div></div>`;

  try {
    const res = await fetch('/api/bookmarks/categorize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ browser: currentBrowser, max_bookmarks: 50 })
    });
    const data = await res.json();

    if (data.result && data.result.error) {
      c.innerHTML = `<div style="color:var(--red);padding:12px;">${data.result.message}</div>`;
      return;
    }

    const categories = (data.result && data.result.categories) || [];
    let html = '<div style="display:grid;gap:8px;margin-top:8px;">';
    categories.forEach(cat => {
      html += `<div class="cat-card">
        <div class="cat-name">${escapeHtml(cat.name)}</div>
        <div class="cat-desc">${escapeHtml(cat.description)}</div>
        <div class="cat-count">${t('contains')} ${cat.bookmarks.length} ${t('items')}</div>
      </div>`;
    });
    html += '</div>';
    c.innerHTML = html;
  } catch (e) {
    c.innerHTML = `<div style="color:var(--red);padding:12px;">${e.message}</div>`;
  }
}

async function exportBookmarks(format) {

/* ══════════════════════════════════════════════════
   AI Organize Wizard
   ══════════════════════════════════════════════════ */
let wizardStep = 0;
let wizardData = { analysis: null, aiCategories: null, aiConfigured: false };

function openAIWizard() {
  if (!currentBrowser || allBookmarks.length === 0) return;
  wizardStep = 0;
  wizardData = { analysis: null, aiCategories: null, aiConfigured: false };
  document.getElementById('wizard-overlay').classList.add('open');
  renderWizardStep();
}

function closeWizard() {
  document.getElementById('wizard-overlay').classList.remove('open');
}

function wizardBack() {
  if (wizardStep > 0) { wizardStep--; renderWizardStep(); }
}

function wizardNext() {
  const maxStep = wizardData.aiConfigured ? 3 : 2;
  if (wizardStep === 0) { runStep1Scan(); return; }
  if (wizardStep === 1 && wizardData.aiConfigured) { runStep2AI(); return; }
  if (wizardStep < maxStep) { wizardStep++; renderWizardStep(); }
}

function renderWizardStep() {
  const totalSteps = wizardData.aiConfigured ? 4 : 3;
  const titles = wizardData.aiConfigured
    ? [t('wizardStep1'), t('wizardStep2'), t('wizardStep3'), t('wizardStep4')]
    : [t('wizardStep1'), t('wizardStep3'), t('wizardStep4')];

  document.getElementById('wizard-title').textContent = titles[wizardStep] || '';

  // Steps dots
  const stepsEl = document.getElementById('wizard-steps');
  stepsEl.innerHTML = Array.from({length: totalSteps}, (_, i) =>
    `<div class="step-dot${i === wizardStep ? ' active' : (i < wizardStep ? ' done' : '')}"></div>`
  ).join('');

  // Back button
  document.getElementById('wizard-back').style.display = wizardStep > 0 ? '' : 'none';
  document.getElementById('wizard-back').textContent = t('back');

  // Next button
  const nextBtn = document.getElementById('wizard-next');
  if (wizardStep === 0) {
    nextBtn.textContent = t('startScan');
  } else if (wizardStep === totalSteps - 1) {
    nextBtn.style.display = 'none';
  } else {
    nextBtn.style.display = '';
    nextBtn.textContent = t('next');
  }

  // Body
  const body = document.getElementById('wizard-body');

  if (wizardStep === 0) {
    // Step 1 intro
    body.innerHTML = `
      <div style="text-align:center;padding:20px 0;">
        <svg width="48" height="48" viewBox="0 0 16 16" fill="none" stroke="var(--blue)" stroke-width="1.25" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
        <div style="font-size:16px;font-weight:700;margin:12px 0 6px;">${t('wizardStep1')}</div>
        <div style="color:var(--muted);font-size:13px;max-width:400px;margin:0 auto;">
          ${_lang === 'zh' ? '将扫描所有 ' + allBookmarks.length.toLocaleString() + ' 条书签，检测重复、URL 问题、命名问题和未分类项目。'
            : 'Will scan all ' + allBookmarks.length.toLocaleString() + ' bookmarks for duplicates, URL issues, naming problems and uncategorized items.'}
        </div>
      </div>`;
  }
}

// Step 1: Scan
async function runStep1Scan() {
  const body = document.getElementById('wizard-body');
  const nextBtn = document.getElementById('wizard-next');
  nextBtn.disabled = true;
  body.innerHTML = `<div class="loading"><div class="spinner"></div><div style="margin-top:8px;">${t('scanning')}</div></div>`;

  try {
    // Run analysis
    const res = await fetch('/api/bookmarks/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ browser: currentBrowser })
    });
    const data = await res.json();
    wizardData.analysis = data.analysis;

    // Check AI config
    try {
      const aiRes = await fetch('/api/bookmarks/ai/config');
      const aiData = await aiRes.json();
      wizardData.aiConfigured = aiData.configured;
    } catch (e) { wizardData.aiConfigured = false; }

    // Update stats card
    const total = data.analysis.issue_count || 0;
    document.getElementById('st-issues').textContent = total;
    document.getElementById('st-issues').style.color = total > 0 ? 'var(--yellow)' : 'var(--green)';
    document.getElementById('st-issues-sub').textContent = '';

    wizardStep = 1;
    nextBtn.disabled = false;
    renderStep1Results();
  } catch (e) {
    body.innerHTML = `<div style="color:var(--red);padding:20px;text-align:center;">${e.message}</div>`;
    nextBtn.disabled = false;
  }
}

function renderStep1Results() {
  const body = document.getElementById('wizard-body');
  const a = wizardData.analysis;
  const issues = a.issues;
  const total = a.issue_count || 0;

  // Re-render next button
  const nextBtn = document.getElementById('wizard-next');
  nextBtn.style.display = '';
  nextBtn.textContent = t('next');
  nextBtn.disabled = false;

  // Update title
  const totalSteps = wizardData.aiConfigured ? 4 : 3;
  const titles = wizardData.aiConfigured
    ? [t('wizardStep1'), t('wizardStep2'), t('wizardStep3'), t('wizardStep4')]
    : [t('wizardStep1'), t('wizardStep3'), t('wizardStep4')];
  document.getElementById('wizard-title').textContent = `${titles[0]} - ${t('scanComplete')}`;

  // Steps dots
  const stepsEl = document.getElementById('wizard-steps');
  stepsEl.innerHTML = Array.from({length: totalSteps}, (_, i) =>
    `<div class="step-dot${i === 1 ? ' active' : (i < 1 ? ' done' : '')}"></div>`
  ).join('');
  document.getElementById('wizard-back').style.display = '';

  if (total === 0) {
    body.innerHTML = `<div style="text-align:center;padding:24px;">
      <svg width="36" height="36" viewBox="0 0 16 16" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round"><path d="M3 8l3 3 7-7"/></svg>
      <div style="font-size:15px;font-weight:600;color:var(--green);margin-top:12px;">${t('noIssuesFound')}</div>
    </div>`;
    return;
  }

  const rows = [
    { key: 'duplicates', label: t('removeDuplicates'), color: 'var(--red)', tag: 'clean', action: t('willRemove') },
    { key: 'url_issues', label: t('cleanUrls'), color: 'var(--yellow)', tag: 'clean', action: t('willClean') },
    { key: 'naming_issues', label: t('fixNames'), color: 'var(--yellow)', tag: 'warn', action: t('willRename') },
    { key: 'large_folders', label: t('largeFolders'), color: 'var(--blue)', tag: 'info', action: '' },
    { key: 'uncategorized', label: t('uncategorized'), color: 'var(--purple)', tag: 'info', action: t('willReclassify') },
  ];

  let html = '';
  rows.forEach(r => {
    const count = (issues[r.key] || []).length;
    if (count === 0) return;
    html += `<div class="issue-row">
      <div class="left">
        <div class="count" style="color:${r.color};">${count}</div>
        <div><div class="label">${r.label}</div>${r.action ? `<div class="desc">${r.action} ${count} ${_lang === 'zh' ? '项' : 'items'}</div>` : ''}</div>
      </div>
      <span class="action-tag ${r.tag}">${r.tag}</span>
    </div>`;
  });

  body.innerHTML = html;
}

// Step 2: AI Classification
async function runStep2AI() {
  const body = document.getElementById('wizard-body');
  const nextBtn = document.getElementById('wizard-next');
  nextBtn.disabled = true;

  body.innerHTML = `<div class="loading"><div class="spinner"></div><div style="margin-top:8px;">${t('aiClassifying')}</div></div>`;

  try {
    const res = await fetch('/api/bookmarks/categorize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ browser: currentBrowser, max_bookmarks: 50 })
    });
    const data = await res.json();
    wizardData.aiCategories = data.result;

    // 构建整理后的书签映射（书签ID → 新分类）
    wizardData.reorganizedBookmarks = buildReorganizedMap(wizardData.aiCategories);

    wizardStep = 2;
    nextBtn.disabled = false;
    renderStep2Results();
  } catch (e) {
    body.innerHTML = `<div style="color:var(--red);padding:20px;text-align:center;">${e.message}</div>`;
    nextBtn.disabled = false;
  }
}

function buildReorganizedMap(aiResult) {
  /**
   * 根据 AI 返回的分类建议，构建书签重组映射
   * 返回格式：{ bookmarkIndex: newFolderName }
   */
  const map = {};
  const categories = (aiResult && aiResult.categories) || [];

  categories.forEach(cat => {
    const folderName = cat.name;
    const bookmarkIndices = cat.bookmarks || [];
    bookmarkIndices.forEach(idx => {
      // AI 返回的是 1-based index，转为 0-based
      map[idx - 1] = folderName;
    });
  });

  return map;
}

function renderStep2Results() {
  const body = document.getElementById('wizard-body');
  const nextBtn = document.getElementById('wizard-next');
  nextBtn.style.display = '';
  nextBtn.textContent = t('next');
  nextBtn.disabled = false;

  document.getElementById('wizard-title').textContent = `${t('wizardStep2')} - ${t('aiClassifyDone')}`;

  // Steps
  const stepsEl = document.getElementById('wizard-steps');
  stepsEl.innerHTML = Array.from({length: 4}, (_, i) =>
    `<div class="step-dot${i === 2 ? ' active' : (i < 2 ? ' done' : '')}"></div>`
  ).join('');
  document.getElementById('wizard-back').style.display = '';

  const cats = (wizardData.aiCategories && wizardData.aiCategories.categories) || [];
  if (cats.length === 0) {
    body.innerHTML = `<div style="text-align:center;padding:24px;color:var(--muted);">${_lang === 'zh' ? 'AI 未返回分类建议' : 'No AI suggestions returned'}</div>`;
    return;
  }

  let html = `<div style="font-size:13px;color:var(--muted);margin-bottom:12px;">${_lang === 'zh' ? 'AI 建议将书签整理为以下分类:' : 'AI suggests organizing bookmarks into:'}</div>`;
  html += '<div style="display:grid;gap:8px;">';
  cats.forEach(cat => {
    const count = (cat.bookmarks || []).length;
    html += `<div class="cat-card">
      <div class="cat-name">${escapeHtml(cat.name)}</div>
      <div class="cat-desc">${escapeHtml(cat.description)}</div>
      <div class="cat-count">${t('contains')} ${count} ${t('items')}</div>
    </div>`;
  });
  html += '</div>';

  // Suggestions
  const suggestions = (wizardData.aiCategories && wizardData.aiCategories.suggestions) || [];
  if (suggestions.length) {
    html += `<div style="margin-top:16px;padding:12px 16px;background:var(--card2);border-radius:8px;font-size:12px;">
      <div style="font-weight:600;margin-bottom:6px;">${_lang === 'zh' ? '整理建议' : 'Suggestions'}</div>
      <ul style="margin:0;padding-left:18px;color:var(--muted);list-style:disc;">
        ${suggestions.map(s => `<li style="margin-bottom:4px;">${escapeHtml(s)}</li>`).join('')}
      </ul>
    </div>`;
  }

  body.innerHTML = html;
}

// Step 3/4: Preview + Edit + Export
function renderPreviewAndEdit() {
  const body = document.getElementById('wizard-body');
  const nextBtn = document.getElementById('wizard-next');
  nextBtn.style.display = '';
  nextBtn.textContent = _lang === 'zh' ? '确认并导出' : 'Confirm & Export';
  nextBtn.disabled = false;

  const totalSteps = wizardData.aiConfigured ? 5 : 4;
  const currentStep = wizardData.aiConfigured ? 3 : 2;

  document.getElementById('wizard-title').textContent = _lang === 'zh' ? '预览和微调' : 'Preview & Edit';
  const stepsEl = document.getElementById('wizard-steps');
  stepsEl.innerHTML = Array.from({length: totalSteps}, (_, i) =>
    `<div class="step-dot${i === currentStep ? ' active' : (i < currentStep ? ' done' : '')}"></div>`
  ).join('');
  document.getElementById('wizard-back').style.display = '';

  const cats = (wizardData.aiCategories && wizardData.aiCategories.categories) || [];
  const reMap = wizardData.reorganizedBookmarks || {};
  const sampleBms = allBookmarks.slice(0, 50); // AI 只分析了前 50 条

  // 获取所有分类名
  const allFolderNames = [...new Set([
    ...cats.map(c => c.name),
    ...sampleBms.map(b => b.folder || (_lang === 'zh' ? '未分类' : 'Uncategorized'))
  ])].sort();

  // ── 看板概览 ──
  let html = `<div style="font-size:13px;color:var(--muted);margin-bottom:12px;">
    ${_lang === 'zh'
      ? '点击分类查看详情，使用下拉框修改书签的目标分类。'
      : 'Click a category to see details. Use dropdowns to change bookmark categories.'}
  </div>`;

  // 统计各分类书签数
  const catCounts = {};
  cats.forEach(cat => {
    catCounts[cat.name] = (cat.bookmarks || []).length;
  });

  // 计算未被分类的数量
  const classifiedIndices = new Set();
  cats.forEach(cat => (cat.bookmarks || []).forEach(i => classifiedIndices.add(i - 1)));
  const unclassifiedCount = sampleBms.filter((_, i) => !classifiedIndices.has(i)).length;
  if (unclassifiedCount > 0) {
    catCounts[_lang === 'zh' ? '未变更' : 'Unchanged'] = unclassifiedCount;
  }

  // 看板卡片
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:16px;">';
  Object.entries(catCounts).forEach(([name, count]) => {
    const isActive = wizardData._previewActiveCategory === name;
    html += `<div class="cat-preview-card${isActive ? ' active' : ''}" onclick="togglePreviewCategory('${escapeHtml(name)}')">
      <div style="font-weight:600;font-size:13px;">${escapeHtml(name)}</div>
      <div style="font-size:22px;font-weight:700;color:var(--blue);margin:4px 0;">${count}</div>
      <div style="font-size:11px;color:var(--muted);">${_lang === 'zh' ? '个书签' : 'bookmarks'}</div>
    </div>`;
  });
  html += '</div>';

  // ── 详细表格（展示选中分类的书签）──
  const activeCategory = wizardData._previewActiveCategory;
  if (activeCategory) {
    // 找出该分类下的书签
    let categoryBookmarks = [];

    if (activeCategory === (_lang === 'zh' ? '未变更' : 'Unchanged')) {
      categoryBookmarks = sampleBms.map((bm, i) => ({...bm, _origIndex: i}))
        .filter(bm => !classifiedIndices.has(bm._origIndex));
    } else {
      const cat = cats.find(c => c.name === activeCategory);
      if (cat) {
        categoryBookmarks = (cat.bookmarks || []).map(idx => {
          const bm = sampleBms[idx - 1];
          return bm ? {...bm, _origIndex: idx - 1} : null;
        }).filter(Boolean);
      }
    }

    html += `<div style="border:1px solid var(--border);border-radius:8px;overflow:hidden;max-height:280px;overflow-y:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <thead>
          <tr style="background:var(--card2);position:sticky;top:0;z-index:1;">
            <th style="text-align:left;padding:8px;width:30%;">${_lang === 'zh' ? '名称' : 'Name'}</th>
            <th style="text-align:left;padding:8px;width:30%;">${_lang === 'zh' ? '当前文件夹' : 'Current'}</th>
            <th style="text-align:left;padding:8px;width:30%;">${_lang === 'zh' ? '新分类' : 'New Category'}</th>
            <th style="text-align:center;padding:8px;width:10%;">${_lang === 'zh' ? '操作' : 'Action'}</th>
          </tr>
        </thead>
        <tbody>`;

    categoryBookmarks.forEach(bm => {
      const origIdx = bm._origIndex;
      const currentFolder = bm.folder || (_lang === 'zh' ? '未分类' : 'Uncategorized');
      const newFolder = reMap[origIdx] || currentFolder;
      const changed = newFolder !== currentFolder;

      html += `<tr style="border-top:1px solid var(--border);${changed ? 'background:rgba(88,166,255,0.04);' : ''}">
        <td style="padding:6px 8px;">
          <a href="${escapeHtml(bm.url)}" target="_blank" rel="noopener" style="color:var(--text);text-decoration:none;" title="${escapeHtml(bm.url)}">${escapeHtml((bm.name || '').slice(0, 30))}</a>
        </td>
        <td style="padding:6px 8px;color:var(--muted);">${escapeHtml(currentFolder)}</td>
        <td style="padding:6px 8px;">
          <select style="width:100%;padding:3px 6px;font-size:11px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:4px;"
                  onchange="updateBookmarkCategory(${origIdx}, this.value)">
            ${allFolderNames.map(f =>
              `<option value="${escapeHtml(f)}"${f === newFolder ? ' selected' : ''}>${escapeHtml(f)}</option>`
            ).join('')}
            <option value="${escapeHtml(currentFolder)}"${!allFolderNames.includes(currentFolder) ? ' selected' : ''}>${escapeHtml(currentFolder)} (${_lang === 'zh' ? '原始' : 'original'})</option>
          </select>
        </td>
        <td style="padding:6px 8px;text-align:center;">
          ${changed
            ? `<button style="font-size:10px;padding:2px 6px;border:1px solid var(--border);border-radius:4px;background:none;color:var(--muted);cursor:pointer;"
                onclick="revertBookmarkCategory(${origIdx})">${_lang === 'zh' ? '还原' : 'Revert'}</button>`
            : `<span style="color:var(--muted2);font-size:10px;">—</span>`}
        </td>
      </tr>`;
    });

    html += `</tbody></table></div>`;
  }

  // 底部操作按钮
  const changedCount = Object.keys(reMap).filter(k => {
    const bm = sampleBms[parseInt(k)];
    return bm && reMap[k] !== bm.folder;
  }).length;

  html += `<div style="display:flex;gap:8px;margin-top:12px;justify-content:space-between;align-items:center;">
    <div style="font-size:12px;color:var(--muted);">
      ${_lang === 'zh' ? `共 ${changedCount} 个书签将被重新分类` : `${changedCount} bookmarks will be recategorized`}
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn" style="font-size:12px;padding:6px 12px;"
              onclick="acceptAllSuggestions()">${_lang === 'zh' ? '采纳全部建议' : 'Accept All'}</button>
      <button class="btn" style="font-size:12px;padding:6px 12px;"
              onclick="resetReorganization()">${_lang === 'zh' ? '重置' : 'Reset'}</button>
    </div>
  </div>`;

  body.innerHTML = html;
}

function togglePreviewCategory(name) {
  if (wizardData._previewActiveCategory === name) {
    wizardData._previewActiveCategory = null;
  } else {
    wizardData._previewActiveCategory = name;
  }
  renderPreviewAndEdit();
}

function updateBookmarkCategory(origIndex, newFolder) {
  if (!wizardData.reorganizedBookmarks) wizardData.reorganizedBookmarks = {};
  wizardData.reorganizedBookmarks[origIndex] = newFolder;
  // 不重新渲染整个面板，只更新计数
}

function revertBookmarkCategory(origIndex) {
  if (wizardData.reorganizedBookmarks) {
    delete wizardData.reorganizedBookmarks[origIndex];
  }
  renderPreviewAndEdit();
}

function acceptAllSuggestions() {
  // 已经在 buildReorganizedMap 中构建了，无需改动
  renderPreviewAndEdit();
}

function resetReorganization() {
  wizardData.reorganizedBookmarks = {};
  renderPreviewAndEdit();
}

// Step 4/5: Export
function renderFinalExport() {
  const body = document.getElementById('wizard-body');
  const nextBtn = document.getElementById('wizard-next');
  nextBtn.style.display = 'none';

  const totalSteps = wizardData.aiConfigured ? 5 : 4;
  const lastStep = totalSteps - 1;
  document.getElementById('wizard-title').textContent = t('wizardStep4');

  const stepsEl = document.getElementById('wizard-steps');
  stepsEl.innerHTML = Array.from({length: totalSteps}, (_, i) =>
    `<div class="step-dot${i === lastStep ? ' active' : ' done'}"></div>`
  ).join('');

  const reMap = wizardData.reorganizedBookmarks || {};
  const sampleBms = allBookmarks.slice(0, 50);
  const changedCount = Object.keys(reMap).filter(k => {
    const bm = sampleBms[parseInt(k)];
    return bm && reMap[k] !== bm.folder;
  }).length;

  let html = `
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:42px;font-weight:800;color:var(--blue);">${changedCount}</div>
      <div style="font-size:13px;color:var(--muted);">${_lang === 'zh' ? '个书签将被重新分类' : 'bookmarks recategorized'}</div>
    </div>
    <div style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px;">
      ${t('exportDesc')}
    </div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-blue" style="padding:10px 24px;" onclick="exportReorganized('html')">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 2v8M4 7l4 4 4-4"/><path d="M2 12v2h12v-2"/></svg>
        ${t('exportHtml')}
      </button>
      <button class="btn" style="padding:10px 24px;" onclick="exportReorganized('json')">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 2v8M4 7l4 4 4-4"/><path d="M2 12v2h12v-2"/></svg>
        ${t('exportJson')}
      </button>
    </div>
    <div style="margin-top:20px;padding:12px 16px;background:rgba(210,153,34,.06);border:1px solid rgba(210,153,34,.2);border-radius:8px;font-size:12px;color:var(--muted);">
      ${_lang === 'zh'
        ? '导出的文件包含整理后的分类结构。下载 HTML 格式后可在浏览器中通过「导入书签」功能导入。'
        : 'Exported file contains the reorganized structure. Download HTML and import via browser\'s "Import Bookmarks" feature.'}
    </div>`;

  body.innerHTML = html;
}

async function exportReorganized(format) {
  // 构建整理后的书签数据
  const reMap = wizardData.reorganizedBookmarks || {};
  const sampleBms = allBookmarks.slice(0, 50);

  const reorganized = sampleBms.map((bm, i) => ({
    ...bm,
    folder: reMap[i] || bm.folder
  }));

  // 未被 AI 分析的书签保持原样
  const rest = allBookmarks.slice(50);
  const allReorganized = [...reorganized, ...rest];

  if (format === 'html') {
    // 生成可导入浏览器的 HTML
    const htmlContent = generateBookmarkHtml(allReorganized);
    downloadFile(`bookmarks_organized.html`, htmlContent, 'text/html');
  } else {
    const jsonContent = JSON.stringify(allReorganized, null, 2);
    downloadFile(`bookmarks_organized.json`, jsonContent, 'application/json');
  }

  closeWizard();
}

function generateBookmarkHtml(bookmarks) {
  // 按文件夹分组
  const folders = {};
  bookmarks.forEach(bm => {
    const folder = bm.folder || (_lang === 'zh' ? '未分类' : 'Uncategorized');
    if (!folders[folder]) folders[folder] = [];
    folders[folder].push(bm);
  });

  let html = `<!DOCTYPE NETSCAPE-Bookmark-file-1>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
<TITLE>Bookmarks</TITLE>
<H1>Bookmarks</H1>
<DL><p>\n`;

  Object.entries(folders).sort((a, b) => a[0].localeCompare(b[0])).forEach(([folder, bms]) => {
    html += `    <DT><H3>${escapeHtml(folder)}</H3>\n    <DL><p>\n`;
    bms.forEach(bm => {
      html += `        <DT><A HREF="${escapeHtml(bm.url)}">${escapeHtml(bm.name)}</A>\n`;
    });
    html += `    </DL><p>\n`;
  });

  html += `</DL><p>`;
  return html;
}

function downloadFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Override wizardNext to handle final steps
const _origWizardNext = wizardNext;
wizardNext = function() {
  // Step 0: Start scan
  if (wizardStep === 0) { runStep1Scan(); return; }

  // Step 1: After scan results → go to AI or preview
  if (wizardStep === 1) {
    if (wizardData.aiConfigured) {
      runStep2AI();
    } else {
      // No AI: go to preview directly (skip AI step)
      wizardStep = 2;
      renderPreviewAndEdit();
    }
    return;
  }

  // Step 2: After AI results → go to preview
  if (wizardStep === 2 && wizardData.aiConfigured) {
    wizardStep = 3;
    renderPreviewAndEdit();
    return;
  }

  // Step 3 (or 2 without AI): Preview → Export
  const previewStep = wizardData.aiConfigured ? 3 : 2;
  if (wizardStep === previewStep) {
    wizardStep = previewStep + 1;
    renderFinalExport();
    return;
  }
};

// Override wizardBack to handle steps correctly
const _origWizardBack = wizardBack;
wizardBack = function() {
  const previewStep = wizardData.aiConfigured ? 3 : 2;
  const exportStep = previewStep + 1;

  if (wizardStep === exportStep) {
    wizardStep = previewStep;
    renderPreviewAndEdit();
    return;
  }
  if (wizardStep === previewStep) {
    if (wizardData.aiConfigured) {
      wizardStep = 2;
      renderStep2Results();
    } else {
      wizardStep = 1;
      renderStep1Results();
    }
    return;
  }
  if (wizardStep === 2) { wizardStep = 1; renderStep1Results(); return; }
  if (wizardStep > 0) { wizardStep--; renderWizardStep(); }
};
