<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude 使用统计 — AI Guard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='2.5' fill='none' stroke='%233b82f6' stroke-width='1.75'/><path d='M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M11 3.6l-1.4 1.4M4.6 11l-1.4 1.4' stroke='%233b82f6' stroke-width='1.75' stroke-linecap='round'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<style>
  /* 暗色主题（默认） */
  :root, [data-theme="dark"] {
    --bg: #0d1117; --card: #161b22; --card2: #1c2128; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --muted2: #6e7681;
    --green: #3fb950; --yellow: #d29922; --red: #f85149;
    --blue: #58a6ff; --purple: #bc8cff;
    --btn-muted-bg: #21262d;
    --shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  /* 亮色主题 */
  [data-theme="light"] {
    --bg: #f6f8fa; --card: #ffffff; --card2: #f6f8fa; --border: #d0d7de;
    --text: #1f2328; --muted: #656d76; --muted2: #8b949e;
    --green: #1a7f37; --yellow: #9a6700; --red: #cf222e;
    --blue: #0969da; --purple: #8250df;
    --btn-muted-bg: #eaeef2;
    --shadow: 0 1px 3px rgba(31,35,40,.12), 0 8px 24px rgba(66,74,83,.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    transition: background .2s, color .2s;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--blue); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .icon-btn { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:background .15s,color .15s; }
  .icon-btn:hover { background:var(--card2); color:var(--text); }
  nav {
    display: flex;
    gap: 6px;
    margin-left: 16px;
  }
  nav a {
    padding: 5px 12px;
    border-radius: 7px;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
  }
  nav a.active {
    background: rgba(88,166,255,0.15);
    color: var(--blue);
  }
  nav a:not(.active) {
    background: var(--btn-muted-bg);
    color: var(--muted);
  }

  /* Main */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 24px;
  }

  /* 顶部控制栏 */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .time-range {
    display: flex;
    gap: 6px;
  }
  .btn {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover {
    background: var(--card2);
    color: var(--text);
  }
  .btn.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .btn-refresh {
    background: rgba(88,166,255,0.1);
    color: var(--blue);
    border-color: rgba(88,166,255,0.3);
  }
  .btn-refresh:hover { background: rgba(88,166,255,0.2); }

  /* 指标卡片网格 */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  @media (max-width: 1024px) {
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .metrics-grid { grid-template-columns: 1fr; }
  }

  .metric-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: all 0.2s;
  }
  .metric-card:hover {
    border-color: var(--blue);
  }
  .metric-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .metric-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .metric-subtitle {
    font-size: 11px;
    color: var(--muted2);
  }

  /* 卡片 */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
  }

  /* 图表容器 */
  .chart-container {
    position: relative;
    height: 300px;
  }

  /* 表格 */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    padding: 8px 10px;
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    background: var(--card2);
  }
  td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  tbody tr:hover {
    background: var(--card2);
  }
  tbody tr:last-child td {
    border-bottom: none;
  }
  .text-right { text-align: right; }
  .text-mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; }

  /* 加载状态 */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--muted);
  }
  .spinner {
    width: 24px;
    height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 24px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">AI <span>Guard</span></div>
  <nav>
    <a href="/">监控面板</a>
    <a href="/bookmarks.html">书签管理</a>
    <a href="/usage.html" class="active">Claude 统计</a>
  </nav>
  <div class="header-right">
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="切换主题"></button>
  </div>
</header>

<main>
  <!-- 控制栏 -->
  <div class="controls">
    <div class="time-range">
      <button class="btn active" data-preset="today">今日</button>
      <button class="btn" data-preset="yesterday">昨天</button>
      <button class="btn" data-preset="last_3_days">近三天</button>
      <button class="btn" data-preset="this_week">本周</button>
      <button class="btn" data-preset="this_month">本月</button>
      <button class="btn" data-preset="">全部</button>
    </div>
    <button class="btn btn-refresh" onclick="refreshData()">刷新数据</button>
  </div>

  <!-- 指标卡片 -->
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label">总 Token 数</div>
      <div class="metric-value" id="total-tokens">—</div>
      <div class="metric-subtitle">输入 + 输出 + 缓存</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">总费用</div>
      <div class="metric-value" id="total-cost">—</div>
      <div class="metric-subtitle">估算费用（美元）</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">活跃天数</div>
      <div class="metric-value" id="active-days">—</div>
      <div class="metric-subtitle">有使用记录的天数</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">使用模型数</div>
      <div class="metric-value" id="models-count">—</div>
      <div class="metric-subtitle">不同模型的数量</div>
    </div>
  </div>

  <!-- Token 使用趋势 -->
  <div class="card">
    <div class="card-title">Token 使用趋势</div>
    <div class="chart-container">
      <canvas id="chart-tokens"></canvas>
    </div>
  </div>

  <!-- 费用趋势 -->
  <div class="card">
    <div class="card-title">费用趋势</div>
    <div class="chart-container">
      <canvas id="chart-cost"></canvas>
    </div>
  </div>

  <!-- 模型使用统计 -->
  <div class="card">
    <div class="card-title">模型使用统计</div>
    <table id="model-stats-table">
      <thead>
        <tr>
          <th>模型</th>
          <th class="text-right">输入 Token</th>
          <th class="text-right">输出 Token</th>
          <th class="text-right">缓存写入</th>
          <th class="text-right">缓存读取</th>
          <th class="text-right">总计</th>
          <th class="text-right">费用</th>
          <th class="text-right">请求次数</th>
        </tr>
      </thead>
      <tbody id="model-stats-body">
        <tr><td colspan="8" class="loading"><div class="spinner"></div></td></tr>
      </tbody>
    </table>
  </div>

  <!-- 每日使用记录 -->
  <div class="card">
    <div class="card-title">每日使用记录</div>
    <table id="daily-usage-table">
      <thead>
        <tr>
          <th>日期</th>
          <th class="text-right">总 Token</th>
          <th class="text-right">费用</th>
          <th>使用模型</th>
        </tr>
      </thead>
      <tbody id="daily-usage-body">
        <tr><td colspan="4" class="loading"><div class="spinner"></div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
// 全局状态
let currentPreset = 'today';
let summaryData = null;
let dailyData = [];
let modelData = [];
let chartTokens = null;
let chartCost = null;

// 主题切换
function _applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const isDark = theme === 'dark';
  const btn = document.getElementById('theme-btn');
  if (btn) btn.innerHTML = isDark
    ? '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M13.5 8.3A5.5 5.5 0 1 1 7.7 2.5 4 4 0 0 0 13.5 8.3z"/></svg>'
    : '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="8" cy="8" r="3.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.6 3.6l1 1M11.4 11.4l1 1M11.4 3.6l-1 1M3.6 11.4l-1 1"/></svg>';
  // 重新渲染图表（颜色跟随主题）
  if (dailyData.length > 0) updateCharts();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ai-guard-theme', next);
  _applyTheme(next);
}

// 获取当前主题下的图表颜色
function chartColors() {
  const isDark = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark';
  return {
    grid: isDark ? '#30363d' : '#d0d7de',
    tick: isDark ? '#8b949e' : '#656d76',
    tooltipBg: isDark ? '#1c2128' : '#ffffff',
    tooltipTitle: isDark ? '#e6edf3' : '#1f2328',
    tooltipBody: isDark ? '#8b949e' : '#656d76',
    tooltipBorder: isDark ? '#30363d' : '#d0d7de',
    blue: isDark ? '#58a6ff' : '#0969da',
    green: isDark ? '#3fb950' : '#1a7f37',
    orange: isDark ? '#d29922' : '#9a6700',
    purple: isDark ? '#bc8cff' : '#8250df',
  };
}

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('ai-guard-theme') || 'dark';
  _applyTheme(saved);
  initTimeRangeButtons();
  loadData();
});

// 时间范围按钮
function initTimeRangeButtons() {
  document.querySelectorAll('.time-range .btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.time-range .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPreset = btn.dataset.preset;
      loadData();
    });
  });
}

// 加载数据
async function loadData() {
  try {
    const params = currentPreset ? `?preset=${currentPreset}` : '';

    // 并行加载所有数据
    const [summary, daily, models] = await Promise.all([
      fetch(`/api/usage/summary${params}`).then(r => r.json()),
      fetch(`/api/usage/daily${params}`).then(r => r.json()),
      fetch(`/api/usage/models${params}`).then(r => r.json())
    ]);

    summaryData = summary;
    dailyData = daily;
    modelData = models;

    updateMetrics();
    updateCharts();
    updateModelTable();
    updateDailyTable();
  } catch (error) {
    console.error('加载数据失败:', error);
  }
}

// 刷新数据
async function refreshData() {
  try {
    await fetch('/api/usage/refresh', { method: 'POST' });
    await loadData();
  } catch (error) {
    console.error('刷新数据失败:', error);
  }
}

// 更新指标卡片
function updateMetrics() {
  if (!summaryData) return;

  document.getElementById('total-tokens').textContent = formatNumber(summaryData.total_tokens);
  document.getElementById('total-cost').textContent = `$${summaryData.total_cost.toFixed(2)}`;
  document.getElementById('active-days').textContent = summaryData.active_days;
  document.getElementById('models-count').textContent = summaryData.models_count;
}

// 更新图表
function updateCharts() {
  if (!dailyData || dailyData.length === 0) return;

  const c = chartColors();
  const labels = dailyData.map(d => d.date);
  const tokenData = dailyData.map(d => d.total_tokens);
  const costData = dailyData.map(d => d.total_cost);

  // Token 趋势图
  const ctxTokens = document.getElementById('chart-tokens').getContext('2d');
  if (chartTokens) chartTokens.destroy();
  chartTokens = new Chart(ctxTokens, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Token',
        data: tokenData,
        borderColor: c.blue,
        backgroundColor: c.blue + '1a',
        fill: true,
        tension: 0.4,
        pointBackgroundColor: c.blue,
        pointRadius: 3,
        pointHoverRadius: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: c.tooltipBg,
          titleColor: c.tooltipTitle,
          bodyColor: c.tooltipBody,
          borderColor: c.tooltipBorder,
          borderWidth: 1,
          padding: 12,
          cornerRadius: 8,
        }
      },
      scales: {
        y: { beginAtZero: true, ticks: { color: c.tick, callback: v => formatNumber(v) }, grid: { color: c.grid + '80' } },
        x: { ticks: { color: c.tick, maxRotation: 0 }, grid: { color: c.grid + '80' } }
      }
    }
  });

  // 费用趋势图
  const ctxCost = document.getElementById('chart-cost').getContext('2d');
  if (chartCost) chartCost.destroy();
  chartCost = new Chart(ctxCost, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Cost',
        data: costData,
        borderColor: c.green,
        backgroundColor: c.green + '1a',
        fill: true,
        tension: 0.4,
        pointBackgroundColor: c.green,
        pointRadius: 3,
        pointHoverRadius: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: c.tooltipBg,
          titleColor: c.tooltipTitle,
          bodyColor: c.tooltipBody,
          borderColor: c.tooltipBorder,
          borderWidth: 1,
          padding: 12,
          cornerRadius: 8,
          callbacks: { label: (ctx) => `$${ctx.parsed.y.toFixed(4)}` }
        }
      },
      scales: {
        y: { beginAtZero: true, ticks: { color: c.tick, callback: v => `$${v.toFixed(2)}` }, grid: { color: c.grid + '80' } },
        x: { ticks: { color: c.tick, maxRotation: 0 }, grid: { color: c.grid + '80' } }
      }
    }
  });
}

// 更新模型统计表格
function updateModelTable() {
  const tbody = document.getElementById('model-stats-body');

  if (!modelData || modelData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state">暂无数据</td></tr>';
    return;
  }

  tbody.innerHTML = modelData.map(m => `
    <tr>
      <td>${m.model_name}</td>
      <td class="text-right text-mono">${formatNumber(m.input_tokens)}</td>
      <td class="text-right text-mono">${formatNumber(m.output_tokens)}</td>
      <td class="text-right text-mono">${formatNumber(m.cache_creation_tokens)}</td>
      <td class="text-right text-mono">${formatNumber(m.cache_read_tokens)}</td>
      <td class="text-right text-mono">${formatNumber(m.total_tokens)}</td>
      <td class="text-right text-mono">$${m.cost.toFixed(4)}</td>
      <td class="text-right text-mono">${m.request_count}</td>
    </tr>
  `).join('');
}

// 更新每日使用表格
function updateDailyTable() {
  const tbody = document.getElementById('daily-usage-body');

  if (!dailyData || dailyData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">暂无数据</td></tr>';
    return;
  }

  tbody.innerHTML = dailyData.slice().reverse().map(d => `
    <tr>
      <td>${d.date}</td>
      <td class="text-right text-mono">${formatNumber(d.total_tokens)}</td>
      <td class="text-right text-mono">$${d.total_cost.toFixed(4)}</td>
      <td style="font-size:11px;color:var(--text-secondary)">${d.models_used.join(', ')}</td>
    </tr>
  `).join('');
}

// 格式化数字
function formatNumber(num) {
  if (num >= 1000000) {
    return (num / 1000000).toFixed(1) + 'M';
  } else if (num >= 1000) {
    return (num / 1000).toFixed(1) + 'K';
  }
  return num.toString();
}
</script>

</body>
</html>
