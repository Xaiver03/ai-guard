<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Guard — 书签管理 v2</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3 2h10a1 1 0 0 1 1 1v11l-6-3-6 3V3a1 1 0 0 1 1-1z' fill='none' stroke='%2358a6ff' stroke-width='1.5'/></svg>">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/components.css">
<style>
/* OneNav 风格布局 */
.bookmarks-layout {
  display: flex;
  height: calc(100vh - 60px);
  gap: 0;
  margin-top: 60px;
}

/* 左侧文件夹树 */
.sidebar {
  width: 260px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-default);
  overflow-y: auto;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-default);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.sidebar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

/* 文件夹树 */
.folder-tree {
  padding: 8px 0;
}

.folder-item {
  padding: 6px 16px 6px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 13px;
  transition: background 0.15s;
}

.folder-item:hover {
  background: var(--row-hover);
  color: var(--text-primary);
}

.folder-item.active {
  background: var(--row-selected);
  color: var(--accent-blue);
  font-weight: 500;
}

.folder-icon {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.folder-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.folder-count {
  font-size: 11px;
  color: var(--text-tertiary);
  background: var(--bg-tertiary);
  padding: 2px 6px;
  border-radius: 10px;
}

/* 右侧主内容区 */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 顶部工具栏 */
.toolbar {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-default);
  display: flex;
  gap: 8px;
  align-items: center;
  background: var(--bg-secondary);
}

.search-box {
  flex: 1;
  max-width: 400px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 6px 12px 6px 32px;
  background: var(--input-bg);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  color: var(--text-primary);
  font-size: 13px;
}

.search-box svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
}

/* 书签列表区域 */
.bookmarks-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.bookmark-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.bookmark-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-default);
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.bookmark-card:hover {
  border-color: var(--accent-blue);
  box-shadow: var(--shadow-hover);
}

.bookmark-header {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin-bottom: 8px;
}

.bookmark-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-top: 2px;
}

.bookmark-title {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bookmark-url {
  font-size: 11px;
  color: var(--text-tertiary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 8px;
}

.bookmark-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.tag-badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
}

.empty-state svg {
  width: 48px;
  height: 48px;
  margin-bottom: 12px;
  opacity: 0.5;
}

.empty-state-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.empty-state-desc {
  font-size: 13px;
}
</style>
</head>
<body>

<!-- 统一顶部导航 -->
<header>
  <div class="header-left">
    <h1 class="logo">AI <span>Guard</span></h1>
    <nav class="nav-tabs">
      <a href="/" class="nav-tab">监控面板</a>
      <a href="/usage.html" class="nav-tab">Claude 统计</a>
      <a href="/bookmarks_v2.html" class="nav-tab active">书签管理</a>
    </nav>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()"></button>
  </div>
</header>

<!-- Toast 通知 -->
<div id="toast"></div>

<!-- 主布局 -->
<div class="bookmarks-layout">
  <!-- 左侧文件夹树 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">文件夹</span>
      <button class="btn btn-sm" onclick="showCreateFolderDialog()">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
      </button>
    </div>
    <div class="folder-tree" id="folder-tree">
      <div class="folder-item active" data-folder-id="all" onclick="selectFolder('all')">
        <svg class="folder-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h4l2 2h6v8H2z"/></svg>
        <span class="folder-name">全部书签</span>
        <span class="folder-count" id="count-all">0</span>
      </div>
    </div>
  </aside>

  <!-- 右侧主内容 -->
  <main class="main-content">
    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
        <input type="text" id="search-input" placeholder="搜索书签..." oninput="searchBookmarks()">
      </div>
      <button class="btn btn-blue" onclick="showAddBookmarkDialog()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
        添加书签
      </button>
      <button class="btn" onclick="showImportDialog()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M8 12V4M5 7l3-3 3 3"/><path d="M2 12v2h12v-2"/></svg>
        导入
      </button>
      <button class="btn" onclick="checkAllLinks()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M7 3H3v10h10V9"/><path d="M10 2h4v4M14 2L8 8"/></svg>
        检测链接
      </button>
    </div>

    <!-- 书签列表 -->
    <div class="bookmarks-area">
      <div class="bookmark-grid" id="bookmark-grid">
        <!-- 书签卡片将动态插入 -->
      </div>
    </div>
  </main>
</div>

<script>
/* ══════════════════════════════════════════════════
   全局状态
   ══════════════════════════════════════════════════ */
let currentFolderId = 'all';
let allBookmarks = [];
let allFolders = [];
let allTags = [];

/* ══════════════════════════════════════════════════
   主题切换
   ══════════════════════════════════════════════════ */
const THEME_ICONS = {
  moon: `<path d="M12 12.5A5.5 5.5 0 0 1 6.5 4a5.5 5.5 0 1 0 7 7.5c-.5.1-1 .05-1.5 0z" fill="currentColor" stroke="none"/>`,
  sun: `<circle cx="8" cy="8" r="3"/><line x1="8" y1="1.5" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="14.5"/><line x1="1.5" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="14.5" y2="8"/><line x1="3.5" y1="3.5" x2="4.5" y2="4.5"/><line x1="11.5" y1="11.5" x2="12.5" y2="12.5"/><line x1="11.5" y1="3.5" x2="12.5" y2="4.5"/><line x1="3.5" y1="11.5" x2="4.5" y2="12.5"/>`,
};

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').innerHTML =
    `<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">${THEME_ICONS[theme === 'dark' ? 'moon' : 'sun']}</svg>`;
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ai-guard-theme', next);
  applyTheme(next);
}

/* ══════════════════════════════════════════════════
   Toast 通知
   ══════════════════════════════════════════════════ */
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  const colors = {
    success: 'var(--accent-green)',
    error: 'var(--accent-red)',
    info: 'var(--accent-blue)',
  };
  toast.textContent = message;
  toast.style.borderColor = colors[type] || colors.info;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ══════════════════════════════════════════════════
   数据加载
   ══════════════════════════════════════════════════ */
async function loadFolders() {
  try {
    const res = await fetch('/api/bookmarks/v2/folders');
    const data = await res.json();
    allFolders = data.folders;
    renderFolderTree();
  } catch (e) {
    console.error('加载文件夹失败:', e);
  }
}

async function loadBookmarks(folderId = null) {
  try {
    const url = folderId && folderId !== 'all'
      ? `/api/bookmarks/v2/bookmarks?folder_id=${folderId}`
      : '/api/bookmarks/v2/bookmarks';
    const res = await fetch(url);
    const data = await res.json();
    allBookmarks = data.bookmarks;
    renderBookmarks();
  } catch (e) {
    console.error('加载书签失败:', e);
  }
}

async function loadStats() {
  try {
    const res = await fetch('/api/bookmarks/v2/stats');
    const data = await res.json();
    document.getElementById('count-all').textContent = data.stats.total_bookmarks;
  } catch (e) {
    console.error('加载统计失败:', e);
  }
}

/* ══════════════════════════════════════════════════
   渲染函数
   ══════════════════════════════════════════════════ */
function renderFolderTree() {
  const tree = document.getElementById('folder-tree');
  const allItem = tree.querySelector('[data-folder-id="all"]');

  // 清空除了"全部书签"之外的项
  tree.innerHTML = '';
  tree.appendChild(allItem);

  // 递归渲染文件夹树
  function renderFolder(folder, level = 0) {
    const item = document.createElement('div');
    item.className = 'folder-item';
    item.dataset.folderId = folder.id;
    item.style.paddingLeft = `${12 + level * 16}px`;
    item.onclick = () => selectFolder(folder.id);

    item.innerHTML = `
      <svg class="folder-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h4l2 2h6v8H2z"/></svg>
      <span class="folder-name">${escapeHtml(folder.name)}</span>
      <span class="folder-count">${folder.bookmark_count || 0}</span>
    `;

    tree.appendChild(item);

    // 渲染子文件夹
    if (folder.children && folder.children.length > 0) {
      folder.children.forEach(child => renderFolder(child, level + 1));
    }
  }

  allFolders.forEach(folder => renderFolder(folder));
}

function renderBookmarks() {
  const grid = document.getElementById('bookmark-grid');

  if (allBookmarks.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2h10a1 1 0 0 1 1 1v11l-6-3-6 3V3a1 1 0 0 1 1-1z"/></svg>
        <div class="empty-state-title">暂无书签</div>
        <div class="empty-state-desc">点击"添加书签"或"导入"开始管理你的书签</div>
      </div>
    `;
    return;
  }

  grid.innerHTML = allBookmarks.map(bm => `
    <div class="bookmark-card" onclick="openBookmark('${escapeHtml(bm.url)}')">
      <div class="bookmark-header">
        <svg class="bookmark-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 3H3v10h10V9M10 2h4v4M14 2L8 8"/></svg>
        <div class="bookmark-title">${escapeHtml(bm.name)}</div>
      </div>
      <div class="bookmark-url">${escapeHtml(bm.url)}</div>
      ${bm.tags && bm.tags.length > 0 ? `
        <div class="bookmark-tags">
          ${bm.tags.map(tag => `<span class="tag-badge" style="background:${tag.color}22;color:${tag.color}">${escapeHtml(tag.name)}</span>`).join('')}
        </div>
      ` : ''}
    </div>
  `).join('');
}

/* ══════════════════════════════════════════════════
   交互功能
   ══════════════════════════════════════════════════ */
function selectFolder(folderId) {
  currentFolderId = folderId;

  // 更新选中状态
  document.querySelectorAll('.folder-item').forEach(item => {
    item.classList.toggle('active', item.dataset.folderId === folderId);
  });

  // 加载书签
  loadBookmarks(folderId === 'all' ? null : folderId);
}

function openBookmark(url) {
  window.open(url, '_blank');
}

function searchBookmarks() {
  const query = document.getElementById('search-input').value.trim();
  if (!query) {
    loadBookmarks(currentFolderId === 'all' ? null : currentFolderId);
    return;
  }

  fetch(`/api/bookmarks/v2/search?q=${encodeURIComponent(query)}`)
    .then(res => res.json())
    .then(data => {
      allBookmarks = data.bookmarks;
      renderBookmarks();
    })
    .catch(e => {
      console.error('搜索失败:', e);
      showToast('搜索失败', 'error');
    });
}

function showAddBookmarkDialog() {
  const name = prompt('书签名称:');
  if (!name) return;

  const url = prompt('书签 URL:');
  if (!url) return;

  fetch('/api/bookmarks/v2/bookmarks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name,
      url,
      folder_id: currentFolderId === 'all' ? null : parseInt(currentFolderId),
    }),
  })
    .then(res => res.json())
    .then(() => {
      showToast('书签已添加');
      loadBookmarks(currentFolderId === 'all' ? null : currentFolderId);
      loadStats();
    })
    .catch(e => {
      console.error('添加失败:', e);
      showToast('添加失败', 'error');
    });
}

function showCreateFolderDialog() {
  const name = prompt('文件夹名称:');
  if (!name) return;

  fetch('/api/bookmarks/v2/folders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  })
    .then(res => res.json())
    .then(() => {
      showToast('文件夹已创建');
      loadFolders();
    })
    .catch(e => {
      console.error('创建失败:', e);
      showToast('创建失败', 'error');
    });
}

function showImportDialog() {
  const browser = prompt('输入浏览器名称 (chrome/edge/safari):');
  if (!browser) return;

  showToast('正在导入...', 'info');

  fetch('/api/bookmarks/v2/import/browser', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ browser }),
  })
    .then(res => res.json())
    .then(data => {
      showToast(`导入成功: ${data.result.imported} 条书签`);
      loadFolders();
      loadBookmarks();
      loadStats();
    })
    .catch(e => {
      console.error('导入失败:', e);
      showToast('导入失败', 'error');
    });
}

async function checkAllLinks() {
  showToast('正在检测链接...', 'info');

  try {
    const res = await fetch('/api/bookmarks/v2/check-links', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    const data = await res.json();
    showToast(`检测完成: ${data.result.alive} 正常, ${data.result.dead} 失效`);
    loadBookmarks(currentFolderId === 'all' ? null : currentFolderId);
  } catch (e) {
    console.error('检测失败:', e);
    showToast('检测失败', 'error');
  }
}

/* ══════════════════════════════════════════════════
   工具函数
   ══════════════════════════════════════════════════ */
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/* ══════════════════════════════════════════════════
   初始化
   ══════════════════════════════════════════════════ */
applyTheme(localStorage.getItem('ai-guard-theme') || 'dark');
loadFolders();
loadBookmarks();
loadStats();
</script>
</body>
</html>
