[server]
host = "127.0.0.1"
port = 8765
open_browser = true

[monitor]
interval_sec = 15
history_points = 60

[alert]
mem_warn = 80
mem_crit = 90
swap_warn = 70
swap_crit = 85
disk_free_warn_gb = 20
disk_free_crit_gb = 10
cooldown_sec = 60
swap_cooldown_sec = 300

[auto_kill]
enabled = false
mem_trigger_pct = 85
swap_trigger_pct = 75
target_mem_pct = 70
cooldown_sec = 120

[processes]
watch_keywords = [
    "claude",
    "codex",
    "copilot",
    "cursor",
    "node",
    "python",
    "pylance",
    "pyright",
]
safe_keywords = [
    "python3",
    "launchd",
]

[processes.scoring]
cpu_caution_pct = 20
idle_min_minutes = 120

[whitelist]
process_names = []
command_keywords = []
pids = []

[usage]
claude_data_dir = "~/.claude"
cache_ttl = 300
auto_refresh_interval = 1800

[ui]
language = "zh"
