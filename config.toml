[server]
host = "127.0.0.1"
port = 8765
open_browser = true

[monitor]
interval_sec = 2
history_points = 150

[alert]
mem_warn = 80
mem_crit = 90
swap_warn = 50
swap_crit = 80
disk_free_warn_gb = 20
disk_free_crit_gb = 10
cooldown_sec = 60
# Swap 告警冷却时间（秒），默认 300 秒（5 分钟）
# Swap 释放较慢，使用更长的冷却时间避免频繁报警
swap_cooldown_sec = 300

[auto_kill]
enabled = false
mem_trigger_pct = 85
swap_trigger_pct = 75
target_mem_pct = 70
cooldown_sec = 120

[processes]
watch_keywords = [
    "claude",
    "codex",
    "copilot",
    "cursor",
    "node",
    "python",
    "pylance",
    "pyright",
]
safe_keywords = [
    "python3",
    "launchd",
]

[whitelist]
# 进程名白名单（精确匹配，不区分大小写）
process_names = []

# 命令行关键字白名单（包含匹配）
command_keywords = []

# PID 白名单（临时，重启后失效，运行时动态添加）
pids = []
