[server]
host = "127.0.0.1"
port = 8765
open_browser = true

[monitor]
# 监控采集间隔（秒），默认 15 秒
interval_sec = 15
# 历史数据点数量，默认 60 点（15 分钟历史）
history_points = 60

[alert]
mem_warn = 80
mem_crit = 90
swap_warn = 70
swap_crit = 85
disk_free_warn_gb = 20
disk_free_crit_gb = 10
cooldown_sec = 60
# Swap 告警冷却时间（秒），默认 300 秒（5 分钟）
# Swap 释放较慢，使用更长的冷却时间避免频繁报警
swap_cooldown_sec = 300

[auto_kill]
enabled = false
mem_trigger_pct = 85
swap_trigger_pct = 75
target_mem_pct = 70
cooldown_sec = 120

[processes]
watch_keywords = [
    "claude",
    "codex",
    "copilot",
    "cursor",
    "node",
    "python",
    "pylance",
    "pyright",
]
safe_keywords = [
    "python3",
    "launchd",
]

# 进程安全评分阈值
[processes.scoring]
# CPU 占用超过此值（%）会被评为 caution（谨慎）
cpu_caution_pct = 20
# 运行时间超过此值（分钟）且 CPU < 1% 会被评为 safe（可终止）
idle_min_minutes = 10

[whitelist]
# 进程名白名单（精确匹配，不区分大小写）
process_names = []

# 命令行关键字白名单（包含匹配）
command_keywords = []

# PID 白名单（临时，重启后失效，运行时动态添加）
pids = []

[usage]
# Claude 数据目录
claude_data_dir = "~/.claude"
# 数据缓存时间（秒）
cache_ttl = 300
# 自动刷新间隔（秒），默认 1800 秒（30 分钟）
# 设置为 0 禁用自动刷新
auto_refresh_interval = 1800
