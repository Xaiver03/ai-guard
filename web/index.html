<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Guard — 资源监控</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='2.5' fill='none' stroke='%233b82f6' stroke-width='1.75'/><path d='M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M11 3.6l-1.4 1.4M4.6 11l-1.4 1.4' stroke='%233b82f6' stroke-width='1.75' stroke-linecap='round'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── 深色主题（默认）──────────────────────────────── */
  :root, [data-theme="dark"] {
    --bg: #0f1117; --card: #1a1d27; --card2: #12141e; --border: #2a2d3e;
    --text: #e2e8f0; --muted: #8892a4; --muted2: #5a6478;
    --green: #22c55e; --yellow: #f59e0b; --red: #ef4444;
    --blue: #3b82f6; --purple: #a855f7;
    --gauge-track: #2a2d3e;
    --row-hover: #1e2130; --row-selected: #1a2230;
    --btn-muted-bg: #2a2d3e;
    --input-bg: #12141e;
    --shadow: 0 4px 24px rgba(0,0,0,.4);
  }

  /* ── 浅色主题 ─────────────────────────────────────── */
  [data-theme="light"] {
    --bg: #f4f6fb; --card: #ffffff; --card2: #f0f2f8; --border: #dde1ec;
    --text: #1a1d2e; --muted: #6b7280; --muted2: #9ca3af;
    --green: #16a34a; --yellow: #d97706; --red: #dc2626;
    --blue: #2563eb; --purple: #7c3aed;
    --gauge-track: #e5e7eb;
    --row-hover: #f0f4ff; --row-selected: #e8eeff;
    --btn-muted-bg: #e5e7eb;
    --input-bg: #f9fafb;
    --shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 14px; min-height: 100vh; transition: background .2s, color .2s; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--blue); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  #status-badge { padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; background: rgba(34,197,94,.15); color: var(--green); display:inline-flex; align-items:center; gap:5px; }
  #status-badge.warn { background: rgba(245,158,11,.15); color: var(--yellow); }
  #status-badge.crit { background: rgba(239,68,68,.15); color: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  #last-update { color: var(--muted); font-size: 12px; }

  /* Icon btn */
  .icon-btn { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:background .15s,color .15s,border-color .15s; flex-shrink:0; }
  .icon-btn:hover { background:var(--card2); color:var(--text); }

  /* Auto-kill toggle */
  #autokill-toggle { padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--card2); color: var(--muted); border: 1px solid var(--border); cursor: pointer; transition: background .2s, color .2s; display:inline-flex; align-items:center; gap:5px; }
  #autokill-toggle:hover { opacity: .85; }
  #autokill-toggle.on { background: rgba(34,197,94,.15); color: var(--green); border-color: rgba(34,197,94,.3); }

  /* SVG icons */
  .icon { display:inline-block; flex-shrink:0; vertical-align:-.125em; }
  .icon-green  { color: var(--green); }
  .icon-yellow { color: var(--yellow); }
  .icon-red    { color: var(--red); }
  .icon-blue   { color: var(--blue); }
  .icon-muted  { color: var(--muted); }

  /* Layout */
  main { padding: 20px 24px; display: grid; gap: 16px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media(max-width: 900px) { .row2 { grid-template-columns: 1fr; } }

  /* Card */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; transition: background .2s, border-color .2s; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }

  /* Gauge */
  .gauge-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .gauge-label { width: 52px; font-size: 13px; color: var(--muted); flex-shrink: 0; }
  .gauge-bar { flex: 1; height: 8px; background: var(--gauge-track); border-radius: 4px; overflow: hidden; }
  .gauge-fill { height: 100%; border-radius: 4px; transition: width .3s ease, background .3s; }
  .gauge-val { width: 60px; text-align: right; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .gauge-detail { font-size: 11px; color: var(--muted); margin-left: 64px; margin-bottom: 10px; }

  /* Chart */
  .chart-wrap { position: relative; height: 150px; }

  /* Batch toolbar */
  .batch-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .batch-count { font-size: 12px; color: var(--muted); }
  .btn { padding: 5px 12px; border-radius: 7px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: opacity .15s; white-space: nowrap; display:inline-flex; align-items:center; gap:5px; }
  .btn:hover { opacity: .8; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn-primary  { background: rgba(34,197,94,.15);  color: var(--green); }
  .btn-warning  { background: rgba(245,158,11,.15); color: var(--yellow); }
  .btn-danger   { background: rgba(239,68,68,.15);  color: var(--red); }
  .btn-muted    { background: var(--btn-muted-bg);  color: var(--muted); }
  .btn-blue     { background: rgba(59,130,246,.15); color: var(--blue); }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--row-hover); }
  tr.selected td { background: var(--row-selected); }
  .proc-name { font-weight: 600; }
  .proc-cmd { color: var(--muted); font-size: 11px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-running { color: var(--green); font-size: 12px; }
  .status-stopped { color: var(--yellow); font-size: 12px; }
  .btn-sm { padding: 3px 8px; border-radius: 5px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; transition: opacity .15s; display:inline-flex; align-items:center; gap:3px; }
  .btn-sm:hover { opacity: .8; }
  .btn-pause  { background: var(--btn-muted-bg); color: var(--yellow); }
  .btn-resume { background: rgba(34,197,94,.15);  color: var(--green); }
  .btn-kill   { background: rgba(239,68,68,.15);  color: var(--red); }
  .btn-gap { display: inline-flex; gap: 4px; }
  .empty-row td { text-align: center; color: var(--muted); padding: 20px; }

  /* Risk */
  .risk-safe    { color: var(--green); font-size: 12px; display:inline-flex; align-items:center; gap:4px; }
  .risk-caution { color: var(--yellow); font-size: 12px; display:inline-flex; align-items:center; gap:4px; }
  .risk-danger  { color: var(--red); font-size: 12px; display:inline-flex; align-items:center; gap:4px; }
  [data-tip] { position: relative; cursor: help; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 6px); left: 0;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 11px; color: var(--text); white-space: pre-wrap;
    min-width: 200px; max-width: 300px; z-index: 100; line-height: 1.6; pointer-events: none;
    box-shadow: var(--shadow);
  }

  /* Auto-kill log */
  .log-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
  .log-item { font-size: 12px; color: var(--muted); padding: 6px 10px; background: var(--card2); border-radius: 6px; border-left: 3px solid var(--red); }
  .log-item .log-name { color: var(--text); font-weight: 600; }
  .log-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 16px; }

  /* Toast */
  #toast { position: fixed; bottom: 24px; right: 24px; padding: 10px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; max-width: 380px; display:flex; align-items:center; gap:7px; box-shadow: var(--shadow); }
  #toast.show { opacity: 1; }

  /* Checkbox */
  input[type=checkbox] { accent-color: var(--blue); width: 14px; height: 14px; cursor: pointer; }

  /* ── Settings Drawer ───────────────────────────── */
  .settings-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; opacity:0; pointer-events:none; transition:opacity .25s; }
  .settings-overlay.open { opacity:1; pointer-events:auto; }
  .settings-drawer { position:fixed; top:0; right:0; bottom:0; width:340px; background:var(--card); border-left:1px solid var(--border); z-index:201; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .25s cubic-bezier(.4,0,.2,1); box-shadow: var(--shadow); }
  .settings-drawer.open { transform:translateX(0); }
  .drawer-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .drawer-title { font-size:15px; font-weight:700; }
  .drawer-body { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:20px; }
  .drawer-footer { display:flex; gap:8px; justify-content:flex-end; padding:14px 20px; border-top:1px solid var(--border); flex-shrink:0; }
  .settings-group { display:flex; flex-direction:column; gap:9px; }
  .settings-group-title { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--muted); padding-bottom:7px; border-bottom:1px solid var(--border); }
  .settings-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .settings-row label { font-size:13px; color:var(--text); flex:1; line-height:1.4; }
  .settings-row .unit { font-size:11px; color:var(--muted); flex-shrink:0; }
  .settings-row input[type=number] { width:72px; background:var(--input-bg); border:1px solid var(--border); border-radius:7px; color:var(--text); font-size:13px; padding:5px 8px; text-align:right; outline:none; transition:border-color .15s; }
  .settings-row input[type=number]:focus { border-color:var(--blue); }
  .settings-row input[type=number]::-webkit-inner-spin-button { opacity:.4; }
</style>
</head>
<body>

<header>
  <div class="logo">AI <span>Guard</span></div>
  <div class="header-right">
    <!-- 主题切换按钮 -->
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="切换深色/浅色主题"></button>
    <!-- 设置按钮 -->
    <button class="icon-btn" id="settings-btn" onclick="openSettings()" title="设置">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="2.5"/>
        <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M11 3.6l-1.4 1.4M4.6 11l-1.4 1.4"/>
      </svg>
    </button>
    <button id="autokill-toggle" onclick="toggleAutoKill()" title="点击开启/关闭超阈值自动终止 Safe 进程"></button>
    <span id="status-badge"></span>
    <span id="last-update">—</span>
  </div>
</header>

<main>
  <!-- 资源进度条 -->
  <div class="card">
    <div class="card-title" style="margin-bottom:12px">资源压力</div>
    <div class="gauge-row">
      <div class="gauge-label">内存</div>
      <div class="gauge-bar"><div class="gauge-fill" id="mem-bar"></div></div>
      <div class="gauge-val" id="mem-pct">—</div>
    </div>
    <div class="gauge-detail" id="mem-detail">— / — GB</div>
    <div class="gauge-row">
      <div class="gauge-label">Swap</div>
      <div class="gauge-bar"><div class="gauge-fill" id="swap-bar"></div></div>
      <div class="gauge-val" id="swap-pct">—</div>
    </div>
    <div class="gauge-detail" id="swap-detail">— / — GB</div>
    <div class="gauge-row">
      <div class="gauge-label">磁盘</div>
      <div class="gauge-bar"><div class="gauge-fill" id="disk-bar"></div></div>
      <div class="gauge-val" id="disk-pct">—</div>
    </div>
    <div class="gauge-detail" id="disk-detail">剩余 — GB</div>
    <div class="gauge-row" style="margin-top:6px">
      <div class="gauge-label">CPU</div>
      <div class="gauge-bar"><div class="gauge-fill" id="cpu-bar"></div></div>
      <div class="gauge-val" id="cpu-pct">—</div>
    </div>
  </div>

  <!-- 趋势图 -->
  <div class="row2">
    <div class="card">
      <div class="card-title" style="margin-bottom:10px">内存 &amp; Swap 趋势（2.5 分钟）</div>
      <div class="chart-wrap"><canvas id="chart-mem"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:10px">CPU &amp; 磁盘趋势（2.5 分钟）</div>
      <div class="chart-wrap"><canvas id="chart-cpu"></canvas></div>
    </div>
  </div>

  <!-- 进程表 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">AI / 开发工具进程</div>
    </div>

    <!-- 批量操作栏 -->
    <div class="batch-toolbar">
      <button class="btn btn-muted" id="btn-select-safe" onclick="selectAllSafe()"></button>
      <button class="btn btn-muted" onclick="selectNone()">取消选择</button>
      <button class="btn btn-danger" id="btn-batch-kill" disabled onclick="batchKill()">终止选中</button>
      <button class="btn btn-warning" id="btn-batch-pause" disabled onclick="batchPause()">暂停选中</button>
      <span style="flex:1"></span>
      <button class="btn btn-primary" id="btn-kill-all-safe" onclick="killAllSafe()"></button>
      <span class="batch-count" id="batch-count"></span>
    </div>

    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="chk-all" onchange="toggleAll(this)"></th>
          <th>PID</th>
          <th>进程名</th>
          <th>命令行</th>
          <th>内存 MB</th>
          <th>CPU %</th>
          <th>状态</th>
          <th>安全评估</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="proc-tbody">
        <tr class="empty-row"><td colspan="9">暂无匹配进程</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 自动终止日志 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">自动终止日志</div>
      <span style="font-size:11px;color:var(--muted)">点击顶部「自动终止」按钮开启</span>
    </div>
    <div class="log-list" id="auto-kill-log">
      <div class="log-empty">暂无自动终止记录</div>
    </div>
  </div>
</main>

<div id="toast"></div>

<!-- Settings 遮罩 + 抽屉 -->
<div class="settings-overlay" id="settings-overlay" onclick="closeSettings()"></div>
<aside class="settings-drawer" id="settings-drawer">
  <div class="drawer-header">
    <span class="drawer-title">设置</span>
    <button class="icon-btn" onclick="closeSettings()" title="关闭">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/>
      </svg>
    </button>
  </div>
  <div class="drawer-body">

    <section class="settings-group">
      <div class="settings-group-title">告警阈值</div>
      <div class="settings-row"><label>内存警告</label><input type="number" min="50" max="99" data-key="alert.mem_warn"><span class="unit">%</span></div>
      <div class="settings-row"><label>内存危险</label><input type="number" min="50" max="99" data-key="alert.mem_crit"><span class="unit">%</span></div>
      <div class="settings-row"><label>Swap 警告</label><input type="number" min="10" max="99" data-key="alert.swap_warn"><span class="unit">%</span></div>
      <div class="settings-row"><label>Swap 危险</label><input type="number" min="10" max="99" data-key="alert.swap_crit"><span class="unit">%</span></div>
      <div class="settings-row"><label>磁盘剩余警告</label><input type="number" min="1" data-key="alert.disk_free_warn_gb"><span class="unit">GB</span></div>
      <div class="settings-row"><label>磁盘剩余危险</label><input type="number" min="1" data-key="alert.disk_free_crit_gb"><span class="unit">GB</span></div>
      <div class="settings-row"><label>告警冷却</label><input type="number" min="10" data-key="alert.cooldown_sec"><span class="unit">秒</span></div>
    </section>

    <section class="settings-group">
      <div class="settings-group-title">自动终止</div>
      <div class="settings-row"><label>内存触发阈值</label><input type="number" min="50" max="99" data-key="auto_kill.mem_trigger_pct"><span class="unit">%</span></div>
      <div class="settings-row"><label>Swap 触发阈值</label><input type="number" min="10" max="99" data-key="auto_kill.swap_trigger_pct"><span class="unit">%</span></div>
      <div class="settings-row"><label>目标内存降至</label><input type="number" min="30" max="95" data-key="auto_kill.target_mem_pct"><span class="unit">%</span></div>
      <div class="settings-row"><label>终止冷却</label><input type="number" min="10" data-key="auto_kill.cooldown_sec"><span class="unit">秒</span></div>
    </section>

    <section class="settings-group">
      <div class="settings-group-title">进程评分规则</div>
      <div class="settings-row"><label>CPU 活跃判定（大于则 caution）</label><input type="number" min="1" max="100" data-key="scoring.cpu_caution_pct"><span class="unit">%</span></div>
      <div class="settings-row"><label>空转判定最短时长</label><input type="number" min="0.5" max="24" step="0.5" data-key="scoring.idle_min_hours"><span class="unit">小时</span></div>
    </section>

    <section class="settings-group">
      <div class="settings-group-title">监控设置</div>
      <div class="settings-row"><label>数据采集间隔</label><input type="number" min="1" max="60" data-key="monitor.interval_sec"><span class="unit">秒</span></div>
    </section>

  </div>
  <div class="drawer-footer">
    <button class="btn btn-muted" onclick="closeSettings()">取消</button>
    <button class="btn btn-blue" onclick="saveSettings()">保存并应用</button>
  </div>
</aside>

<script>
// ── SVG 图标库 ────────────────────────────────────────────
const ICONS = {
  bolt:   `<path d="M9.5 2L4 9h4.5L7 14l6-7H9.5z" fill="currentColor" stroke="none"/>`,
  check:  `<polyline points="2.5,8.5 6,12.5 13.5,4" stroke-width="2"/>`,
  warn:   `<path d="M8 2.5L14.5 14H1.5z" stroke-width="1.75"/><line x1="8" y1="7" x2="8" y2="10.5" stroke-width="2"/><circle cx="8" cy="12.5" r="0.85" fill="currentColor" stroke="none"/>`,
  cross:  `<line x1="3" y1="3" x2="13" y2="13" stroke-width="2"/><line x1="13" y1="3" x2="3" y2="13" stroke-width="2"/>`,
  dot:    `<circle cx="8" cy="8" r="5" fill="currentColor" stroke="none"/>`,
  star:   `<polygon points="8,2 9.8,6.3 14.5,6.6 11,9.8 12.2,14.5 8,11.8 3.8,14.5 5,9.8 1.5,6.6 6.2,6.3" stroke-width="1.2"/>`,
};
function icon(name, cls='') {
  const paths = ICONS[name] || '';
  return `<svg class="icon${cls?' '+cls:''}" viewBox="0 0 16 16" width="1em" height="1em"
    fill="none" stroke="currentColor" stroke-width="1.75"
    stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${paths}</svg>`;
}

// ── 状态 ──────────────────────────────────────────────────
let _lastProcs = [];
let _selectedPids = new Set();
let _autokillTriggerPct = 85;

// ── 页面初始化：填充带图标的按钮文字 ──
(function initButtons() {
  document.getElementById('btn-select-safe').innerHTML =
    `全选 ${icon('check','icon-green')} 安全`;
  document.getElementById('btn-kill-all-safe').innerHTML =
    `${icon('bolt')} 一键终止所有 ${icon('check','icon-green')} 安全进程`;
  // 初始状态下自动终止按钮
  setAutoKillUI(false, 85);
  // 初始状态徽章
  setStatus('normal');
})();

// ── 颜色 ──
function barColor(pct) {
  if (pct >= 90) return '#ef4444';
  if (pct >= 70) return '#f59e0b';
  return '#22c55e';
}

// ── 进度条 ──
function setBar(barId, pctId, pct) {
  const bar = document.getElementById(barId);
  const txt = document.getElementById(pctId);
  bar.style.width = Math.min(pct, 100) + '%';
  bar.style.background = barColor(pct);
  if (txt) txt.textContent = pct.toFixed(1) + '%';
}

// ── 状态徽章 ──
function setStatus(level) {
  const el = document.getElementById('status-badge');
  el.className = '';
  if (level === 'crit') {
    el.innerHTML = icon('warn','icon-red') + ' 危险';
    el.className = 'crit';
  } else if (level === 'warn') {
    el.innerHTML = icon('dot','icon-yellow') + ' 警告';
    el.className = 'warn';
  } else {
    el.innerHTML = icon('check','icon-green') + ' 正常';
  }
}

// ── 图表 ──
const MAX_PTS = 150;
const labels = [];
function makeChart(id, datasets) {
  return new Chart(document.getElementById(id).getContext('2d'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#8892a4', boxWidth: 12, font: { size: 11 } } } },
      scales: {
        x: { display: false },
        y: { min: 0, max: 100, grid: { color: '#2a2d3e' },
             ticks: { color: '#8892a4', font: { size: 10 }, callback: v => v + '%' } }
      }
    }
  });
}
const chartMem = makeChart('chart-mem', [
  { label: '内存 %',  data: [], borderColor: '#3b82f6', backgroundColor: '#3b82f618', tension: 0.3, pointRadius: 0, fill: true },
  { label: 'Swap %', data: [], borderColor: '#a855f7', backgroundColor: '#a855f718', tension: 0.3, pointRadius: 0, fill: true },
]);
const chartCpu = makeChart('chart-cpu', [
  { label: 'CPU %',  data: [], borderColor: '#22c55e', backgroundColor: '#22c55e18', tension: 0.3, pointRadius: 0, fill: true },
  { label: '磁盘 %', data: [], borderColor: '#f59e0b', backgroundColor: '#f59e0b18', tension: 0.3, pointRadius: 0, fill: true },
]);

function pushCharts(m) {
  const ts = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  labels.push(ts);
  if (labels.length > MAX_PTS) labels.shift();
  const pushArr = (arr, v) => { arr.push(v); if (arr.length > MAX_PTS) arr.shift(); };
  pushArr(chartMem.data.datasets[0].data, m.mem_percent);
  pushArr(chartMem.data.datasets[1].data, m.swap_percent);
  pushArr(chartCpu.data.datasets[0].data, m.cpu_percent);
  pushArr(chartCpu.data.datasets[1].data, m.disk_percent);
  chartMem.update('none');
  chartCpu.update('none');
}

// ── 更新指标 ──
function updateMetrics(m) {
  if (!m) return;
  setBar('mem-bar',  'mem-pct',  m.mem_percent);
  setBar('swap-bar', 'swap-pct', m.swap_percent);
  setBar('disk-bar', 'disk-pct', m.disk_percent);
  setBar('cpu-bar',  'cpu-pct',  m.cpu_percent);
  document.getElementById('mem-detail').textContent  = `${m.mem_used_gb} / ${m.mem_total_gb} GB（可用 ${m.mem_available_gb} GB）`;
  document.getElementById('swap-detail').textContent = `${m.swap_used_gb} / ${m.swap_total_gb} GB`;
  document.getElementById('disk-detail').textContent = `剩余 ${m.disk_free_gb} GB（共 ${m.disk_total_gb} GB）`;
  setStatus(m.alert_level || 'normal');
  document.getElementById('last-update').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  pushCharts(m);
}

// ── 更新进程表 ──
function updateProcesses(procs) {
  _lastProcs = procs || [];
  const tbody = document.getElementById('proc-tbody');

  if (!_lastProcs.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="9">暂无匹配的 AI / 开发工具进程</td></tr>';
    updateBatchButtons();
    return;
  }

  const prevSelected = new Set(_selectedPids);

  tbody.innerHTML = _lastProcs.map(p => {
    const isStopped  = p.status === 'stopped';
    const statusCls  = isStopped ? 'status-stopped' : 'status-running';
    const statusTxt  = isStopped ? '已暂停' : p.status;
    const risk       = p.risk || 'safe';
    const tipText    = (p.risk_reasons || []).map(r => '• ' + r).join('\n');
    const isChecked  = prevSelected.has(p.pid);
    const isSelected = isChecked ? 'selected' : '';

    // risk label with icon
    let riskIcon = '';
    let riskText = p.risk_label || '—';
    if (risk === 'safe')    { riskIcon = icon('check','icon-green');  riskText = '可安全终止'; }
    if (risk === 'caution') { riskIcon = icon('warn','icon-yellow');  riskText = '谨慎（建议先暂停）'; }
    if (risk === 'danger')  { riskIcon = icon('cross','icon-red');    riskText = '不建议操作'; }

    let actions = '';
    if (isStopped) {
      actions = `<div class="btn-gap">
        <button class="btn-sm btn-resume" onclick="doAction(${p.pid},'resume')">恢复</button>
        <button class="btn-sm btn-kill"   onclick="doAction(${p.pid},'kill')">终止</button>
      </div>`;
    } else if (risk === 'danger') {
      actions = `<div class="btn-gap">
        <button class="btn-sm btn-pause" style="opacity:.3;cursor:not-allowed" title="高危进程，不建议操作">—</button>
      </div>`;
    } else if (p.suggested_action === 'pause') {
      actions = `<div class="btn-gap">
        <button class="btn-sm btn-pause" onclick="doAction(${p.pid},'pause')">${icon('star','icon-yellow')} 暂停</button>
        <button class="btn-sm btn-kill"  onclick="doAction(${p.pid},'kill')">终止</button>
      </div>`;
    } else {
      actions = `<div class="btn-gap">
        <button class="btn-sm btn-kill"  style="font-weight:700" onclick="doAction(${p.pid},'kill')">${icon('star','icon-yellow')} 终止</button>
        <button class="btn-sm btn-pause" onclick="doAction(${p.pid},'pause')">暂停</button>
      </div>`;
    }

    return `<tr class="${isSelected}" data-pid="${p.pid}">
      <td><input type="checkbox" class="proc-chk" data-pid="${p.pid}" ${isChecked ? 'checked' : ''} onchange="onCheckChange(this)"></td>
      <td>${p.pid}</td>
      <td><div class="proc-name">${p.name}</div></td>
      <td><div class="proc-cmd" title="${p.cmdline}">${p.cmdline || '—'}</div></td>
      <td>${p.mem_mb.toFixed(0)}</td>
      <td>${p.cpu_percent.toFixed(1)}</td>
      <td class="${statusCls}">${statusTxt}</td>
      <td><div class="risk-${risk}" data-tip="${tipText}">${riskIcon} ${riskText}</div></td>
      <td>${actions}</td>
    </tr>`;
  }).join('');

  updateBatchButtons();
}

// ── 勾选逻辑 ──
function onCheckChange(chk) {
  const pid = parseInt(chk.dataset.pid);
  if (chk.checked) _selectedPids.add(pid);
  else             _selectedPids.delete(pid);
  chk.closest('tr').classList.toggle('selected', chk.checked);
  updateBatchButtons();
}

function toggleAll(masterChk) {
  document.querySelectorAll('.proc-chk').forEach(chk => {
    chk.checked = masterChk.checked;
    const pid = parseInt(chk.dataset.pid);
    if (masterChk.checked) _selectedPids.add(pid);
    else                   _selectedPids.delete(pid);
    chk.closest('tr').classList.toggle('selected', masterChk.checked);
  });
  updateBatchButtons();
}

function selectAllSafe() {
  _selectedPids.clear();
  document.querySelectorAll('.proc-chk').forEach(chk => {
    const pid  = parseInt(chk.dataset.pid);
    const proc = _lastProcs.find(p => p.pid === pid);
    const safe = proc && proc.risk === 'safe';
    chk.checked = safe;
    if (safe) _selectedPids.add(pid);
    chk.closest('tr').classList.toggle('selected', safe);
  });
  updateBatchButtons();
}

function selectNone() {
  _selectedPids.clear();
  document.querySelectorAll('.proc-chk').forEach(chk => {
    chk.checked = false;
    chk.closest('tr').classList.remove('selected');
  });
  updateBatchButtons();
}

function updateBatchButtons() {
  const n = _selectedPids.size;
  document.getElementById('btn-batch-kill').disabled  = n === 0;
  document.getElementById('btn-batch-pause').disabled = n === 0;
  document.getElementById('batch-count').textContent  = n > 0 ? `已选 ${n} 个` : '';
}

// ── 批量操作 ──
async function batchKill() {
  const pids = [..._selectedPids];
  if (!pids.length) return;
  if (!confirm(`确认终止选中的 ${pids.length} 个进程？`)) return;
  try {
    const res  = await fetch('/api/processes/batch/kill', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pids }),
    });
    const data = await res.json();
    const ok   = data.results.filter(r => r.success).length;
    showToast('check', `已终止 ${ok}/${pids.length} 个进程，释放约 ${data.total_freed_mb} MB`);
    selectNone();
  } catch (e) { showToast('cross', e.message, true); }
}

async function batchPause() {
  const pids = [..._selectedPids];
  if (!pids.length) return;
  try {
    const res  = await fetch('/api/processes/batch/pause', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pids }),
    });
    const data = await res.json();
    const ok   = data.results.filter(r => r.success).length;
    showToast('check', `已暂停 ${ok}/${pids.length} 个进程`);
    selectNone();
  } catch (e) { showToast('cross', e.message, true); }
}

async function killAllSafe() {
  const safeCount = _lastProcs.filter(p => p.risk === 'safe').length;
  if (!safeCount) { showToast('warn', '没有可安全终止的进程'); return; }
  if (!confirm(`确认一键终止全部 ${safeCount} 个「可安全终止」进程？`)) return;
  try {
    const res  = await fetch('/api/processes/batch/kill-safe', { method: 'POST' });
    const data = await res.json();
    showToast('bolt', `已终止 ${data.killed} 个安全进程，释放约 ${data.total_freed_mb} MB`);
  } catch (e) { showToast('cross', e.message, true); }
}

// ── 单进程操作 ──
async function doAction(pid, action) {
  try {
    const res  = await fetch(`/api/processes/${pid}/${action}`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '操作失败');
    showToast('check', `${data.message}${data.mem_freed_mb ? '，释放约 ' + data.mem_freed_mb + ' MB' : ''}`);
  } catch (e) { showToast('cross', e.message, true); }
}

// ── 自动终止日志 ──
function updateAutoKillLog(log) {
  const el = document.getElementById('auto-kill-log');
  if (!log || !log.length) {
    el.innerHTML = '<div class="log-empty">暂无自动终止记录</div>';
    return;
  }
  el.innerHTML = [...log].reverse().map(entry => {
    const t = new Date(entry.ts * 1000).toLocaleTimeString('zh-CN', { hour12: false });
    return `<div class="log-item">
      <span class="log-name">${entry.name}</span> PID ${entry.pid}
      &nbsp;·&nbsp; ${entry.mem_mb.toFixed(0)} MB &nbsp;·&nbsp; ${t}<br>
      <span>${entry.reason}</span>
    </div>`;
  }).join('');
}

// ── 自动终止开关 ──
function setAutoKillUI(enabled, triggerPct) {
  const btn = document.getElementById('autokill-toggle');
  if (!btn) return;
  if (enabled) {
    btn.innerHTML = `${icon('bolt','icon-green')} 自动终止: 开 (≥${triggerPct || '?'}%)`;
    btn.className = 'on';
  } else {
    btn.innerHTML = `${icon('bolt')} 自动终止: 关`;
    btn.className = '';
  }
}

async function toggleAutoKill() {
  try {
    const res  = await fetch('/api/autokill/toggle', { method: 'POST' });
    const data = await res.json();
    const s    = await fetch('/api/autokill/status').then(r => r.json());
    _autokillTriggerPct = s.mem_trigger_pct || 85;
    setAutoKillUI(data.enabled, s.mem_trigger_pct);
    if (data.enabled) {
      showToast('bolt', `自动终止已开启（内存 ≥ ${s.mem_trigger_pct}% 触发）`);
    } else {
      showToast('bolt', '自动终止已关闭');
    }
  } catch (e) { showToast('cross', e.message, true); }
}

async function loadAutoKillStatus() {
  try {
    const data = await fetch('/api/autokill/status').then(r => r.json());
    _autokillTriggerPct = data.mem_trigger_pct || 85;
    setAutoKillUI(data.enabled, data.mem_trigger_pct);
  } catch (_) {}
}

// ── Toast ──
let _toastTimer;
function showToast(iconName, msg, isErr = false) {
  const el = document.getElementById('toast');
  const cls = isErr ? 'icon-red' : (iconName === 'bolt' ? 'icon-yellow' : 'icon-green');
  el.innerHTML = icon(iconName, cls) + `<span>${msg}</span>`;
  el.style.borderColor = isErr ? '#ef4444' : '#22c55e';
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}

// ── SSE 连接 ──
function connect() {
  const es = new EventSource('/api/stream');
  es.onmessage = e => {
    try {
      const { metrics, processes, auto_kill_log, autokill_enabled } = JSON.parse(e.data);
      updateMetrics(metrics);
      updateProcesses(processes);
      updateAutoKillLog(auto_kill_log);
      if (autokill_enabled !== undefined) {
        setAutoKillUI(autokill_enabled, _autokillTriggerPct);
      }
    } catch (_) {}
  };
  es.onerror = () => { es.close(); setTimeout(connect, 3000); };
}

// ── Settings 抽屉 ──
async function openSettings() {
  try {
    const data = await fetch('/api/settings').then(r => r.json());
    document.querySelectorAll('[data-key]').forEach(el => {
      const [group, key] = el.dataset.key.split('.');
      if (data[group] && data[group][key] !== undefined) {
        el.value = data[group][key];
      }
    });
    document.getElementById('settings-overlay').classList.add('open');
    document.getElementById('settings-drawer').classList.add('open');
  } catch (e) { showToast('cross', '加载设置失败: ' + e.message, true); }
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
  document.getElementById('settings-drawer').classList.remove('open');
}

async function saveSettings() {
  const payload = {};
  document.querySelectorAll('[data-key]').forEach(el => {
    const [group, key] = el.dataset.key.split('.');
    if (!payload[group]) payload[group] = {};
    payload[group][key] = parseFloat(el.value);
  });
  try {
    const res = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error((await res.json()).detail || '保存失败');
    // 刷新自动终止按钮阈值显示
    const s = await fetch('/api/autokill/status').then(r => r.json());
    _autokillTriggerPct = s.mem_trigger_pct || 85;
    setAutoKillUI(s.enabled, s.mem_trigger_pct);
    showToast('check', '设置已保存并立即生效');
    closeSettings();
  } catch (e) { showToast('cross', e.message, true); }
}

loadAutoKillStatus();
connect();
</script>
</body>
</html>
